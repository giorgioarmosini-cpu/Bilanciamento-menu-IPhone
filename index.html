      ${opt('diary', 'Diario del giorno', dOK ? dateLabel(selDate()) : 'Il diario del giorno scelto è vuoto')}
      ${opt('trend', 'Andamento', R.used ? `${trendLabel(S.ui.trendDays)}: medie, grafico e giorni registrati` : 'Nessun giorno registrato nel periodo')}
      ${opt('day', 'Menù di '+DAY_NAMES[S.ui.day].toLowerCase(), mOK ? 'Pasti, alimenti, grammi, macro e minerali' : 'Il menù di questo giorno è vuoto')}
      ${opt('week', 'Riepilogo settimanale', 'Medie del menù e confronto con i valori ideali')}
      ${opt('full', 'Settimana completa', 'Riepilogo più il dettaglio di ogni giorno compilato')}
      ${opt('shop', 'Lista della spesa', shopN ? `${shopN} alimenti` : 'Nessun alimento nei giorni scelti')}
    </div>
    <div style="margin-top:16px;max-width:360px"><label class="fld" for="sh-wa">Numero WhatsApp (facoltativo)</label><input class="in" id="sh-wa" inputmode="tel" value="${esc(S.share.wa)}" placeholder="Es. 3401234567"></div>
    <p class="help">Condividi apre l'elenco delle app del dispositivo: WhatsApp, email, Telegram, Drive e altre. WhatsApp va dritto alla chat, se hai indicato un numero.</p>`,
    `<button class="btn quiet" data-sh="save">Salva PDF</button><span class="grow"></span><button class="btn wa" data-sh="wa">${WA_ICON}WhatsApp</button><button class="btn pri" data-sh="share">${SHARE_ICON}Condividi</button>`);
  $$('.opt').forEach(b=>b.onclick = ()=>{ shareKind = b.dataset.sk; $$('.opt').forEach(o=>o.setAttribute('aria-pressed', o===b)); });
  $$('[data-sh]').forEach(b=>b.onclick = ()=>{ S.share.wa = $('#sh-wa').value.trim(); save(); doShare(b.dataset.sh); });
}
/* testo semplice (lista della spesa) verso WhatsApp o altre app */
async function shareText(text, mode){
  const phone = waNumber();
  if(window.AndroidBridge && typeof AndroidBridge.shareText==='function'){ AndroidBridge.shareText(text, mode==='wa'?phone:'', mode==='wa'); return; }
  if(mode!=='wa' && navigator.share){ try{ await navigator.share({text}); return; }catch(e){ if(e && e.name==='AbortError') return; } }
  window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(text), '_blank');
}
async function doShare(mode){
  let r;
  try{ r = buildReport(shareKind); }catch(err){ console.error(err); toast('Non è stato possibile creare il PDF'); return; }
  if(mode==='save'){ saveBytes(r.bytes, r.name, 'application/pdf'); closeSheet(); if(!window.AndroidBridge) toast('PDF salvato: '+r.name); return; }
  const phone = waNumber();
  if(window.AndroidBridge && AndroidBridge.sharePdf){
    AndroidBridge.sharePdf(toB64(r.bytes), r.name, r.caption, mode==='wa' ? phone : '', mode==='wa');
    closeSheet(); return;
  }
  let file = null;
  try{ file = new File([r.bytes], r.name, {type:'application/pdf'}); }catch(e){}
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:r.name.replace(/\.pdf$/,''), text:r.caption}); closeSheet(); return; }
    catch(err){ if(err && err.name==='AbortError') return; }
  }
  saveBytes(r.bytes, r.name, 'application/pdf'); closeSheet();
  if(mode==='wa'){
    window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(r.caption), '_blank');
    toast('PDF salvato nei Download: allegalo nella chat di WhatsApp');
  } else toast('Condivisione non disponibile qui: PDF salvato nei Download');
}

function shortDate(k, withDay){ return new Intl.DateTimeFormat(loc(), withDay ? {weekday:'short', day:'numeric', month:'short'} : {day:'numeric', month:'numeric'}).format(keyDate(k)); }

const NOT_FOOD = /^(sale |bicarbonato|acqua|bevand|succo|succhi|soda|aranciat|cola |coca |spumant|brodo|chinotto|gassos|te |the |tisan|caffe|orzo solubile|birra|vino|spremut|liquor|grappa|spumante|sciropp|brandy|whisky|vodka|rum |amaro |aperitiv|cognac|marsala|vermouth)/;
const NOT_DISH = /gelatina alimentare|estratto|midollo|in polvere|lievito|dado|farina lattea|dolcificant|alcool|alcol|%vol|\bvol\b|amari\b|amaro\b|liquor|distillat|grappa|whisky|brandy|cognac|vermouth|marsala|\bvino\b|\bvini\b|birra|caramell|gomme|canditi|candita|ciccioli|maionese|aroma|strutto|lardo/;
function openSuggest(){
  const k = selDate(), T = diaryTotals(k), P = profileCalc();
  const lim = remainLimits(T, P).filter(r=>isFinite(r[2]));
  const meal = S.ui.sugMeal || mealByClock();
  const sorts = [['spazio','Più spazio'],['prot','Più proteine'],['K','Meno potassio'],['P','Meno fosforo'],['Na','Meno sodio']];
  let list = '';
  if(!lim.length) list = `<div class="banner info">Completa il Profilo e i valori massimi per ricevere suggerimenti.</div>`;
  else {
    const avoid = new Set(S.avoid), val = (f,kk)=> kk==='energia' ? f.v[I.energia] : kk==='Na' ? f.v[I.Na]+f.v[I.Na2] : f.v[I[kk]];
    const res = [];
    for(const f of DB.list){
      if(avoid.has(f.id) || f.v[I.energia] < 5 || NOT_FOOD.test(f.key+' ') || NOT_DISH.test(f.key) || (f.v[I.acqua]>=80 && f.v[I.fibra]<0.5 && f.v[I.proteine]<1.5)) continue;
      let g = Infinity;                                   // quantità massima reale che resta entro tutti i limiti
      for(const [kk,,r] of lim){ const per = val(f,kk)/100; if(per>0) g = Math.min(g, r>0 ? r/per : 0); }
      if(g >= 30) res.push([f, g]);
    }
    const ratio = (f,kk)=> f.v[I.energia]>0 ? val(f,kk)*100/f.v[I.energia] : 1e9;
    const by = {spazio:(a,b)=>b[1]-a[1] || a[0].key.localeCompare(b[0].key), prot:(a,b)=>Math.round(Math.min(b[1],150)*b[0].v[I.proteine]/50)-Math.round(Math.min(a[1],150)*a[0].v[I.proteine]/50) || b[1]-a[1],
      K:(a,b)=>ratio(a[0],'K')-ratio(b[0],'K'), P:(a,b)=>ratio(a[0],'P')-ratio(b[0],'P'), Na:(a,b)=>ratio(a[0],'Na')-ratio(b[0],'Na')}[S.ui.sugSort] ;
    let pool = res.filter(([f])=>f.v[I.proteine]+f.v[I.fibra] >= 1);            // solo alimenti "con sostanza": niente zucchero, gomme, alcolici
    if(['K','P','Na'].includes(S.ui.sugSort)) pool = pool.filter(([f])=>f.v[I.energia] >= 30 && val(f, S.ui.sugSort) > 0);   // 0 = valore mancante nella tabella
    pool.sort(by || ((a,b)=>b[1]-a[1]));
    list = pool.slice(0,25).map(([f,g])=>`<button class="sug" data-sug="${f.id}" data-sug-g="${Math.max(10, Math.min(Math.floor(g/10)*10, f.kind==='recipe'?250:150))}"><b class="nm">${esc(f.disp)}</b><span class="fit num">${g>1000 ? 'oltre 1 kg' : 'fino a '+fmt(g)+' g'}</span>
      <small class="num">Per 100 g: ${fmt(f.v[I.energia])} kcal, proteine ${fmt(f.v[I.proteine],1)} g, K ${fmt(f.v[I.K])} mg, P ${fmt(f.v[I.P])} mg, Na ${fmt(f.v[I.Na]+f.v[I.Na2])} mg</small></button>`).join('')
      || `<div class="empty">Nessun alimento della tabella sta nel margine rimasto.</div>`;
  }
  openSheet('Suggerimenti', `<p class="help" style="margin-top:-4px">Alimenti che stanno nel margine rimasto; "fino a" indica la quantità massima prima di superare un limite. Esclusi gli alimenti da evitare. Nella tabella alcuni valori mancano e valgono zero: per i minerali quegli alimenti non vengono proposti.</p>
    <div class="row" style="margin:10px 0 12px"><select class="in" id="sg-meal" style="width:auto">${MEALS.map(M=>`<option value="${M.k}" ${M.k===meal?'selected':''}>${M.l}</option>`).join('')}</select>
    <div class="chipsel">${sorts.map(([kk,l])=>`<button data-sgsort="${kk}" aria-pressed="${S.ui.sugSort===kk}">${l}</button>`).join('')}</div></div>
    <div>${list}</div>`, '');
  $('#sg-meal').onchange = e=>{ S.ui.sugMeal = e.target.value; };
}

function trendKeys(n){
  const end = dateKey(); let start;
  if(n==='all'){
    const ks = Object.keys(S.diary).filter(k=>entryUsed(S.diary[k])).concat(activeWeights().map(w=>w.d)).sort();
    start = ks[0] && ks[0] < end ? ks[0] : end;
  } else start = addDays(end, -(n-1));
  const out = []; for(let k=start; k<=end && out.length<4000; k=addDays(k,1)) out.push(k);
  return out;
}
function trendData(n){
  const keys = trendKeys(n), days = keys.map(k=>({k, T:diaryTotals(k)})), used = days.filter(d=>d.T.used);
  let a = null, x = null;
  if(used.length){ a = zeros(); for(const d of used) for(let i=0;i<NV;i++) a[i] += d.T.t[i]; for(let i=0;i<NV;i++) a[i] /= used.length; x = derive(a); }
  return {keys, days, used:used.length, a, x};
}

function trendChart(R, par, P){

  else vals = R.days.map(d=>trendVal(d, par));
  if(par==='energia'){ refs = [[P.kcalMax,'Max','var(--over)'],[P.kcalIdeal,'Ideale','var(--ok)']]; }
  else if(par==='proteine') refs = [[P.protMax,'Max','var(--over)']];
  else if(['K','P','Na'].includes(par)) refs = [[V[par].m,'Max','var(--over)'],[V[par].i,'Ideale','var(--ok)']];
  else if(par==='acqua') refs = [[V.acqua.i,'Ideale','var(--ok)']];
  refs = refs.filter(r=>isFinite(r[0]));
  const nums = vals.filter(v=>v!=null);
  if(!nums.length) return `<div class="empty">Nessun valore nel periodo per questo parametro.</div>`;
  let lo = par==='peso' ? Math.min(...nums) : 0, hi = Math.max(...nums, ...refs.map(r=>r[0]));
  if(par==='peso'){ lo = Math.floor(lo-2); hi = Math.ceil(hi+2); } else hi *= 1.12;
  const raw = (hi-lo)/4, mag = Math.pow(10, Math.floor(Math.log10(raw||1))), step = [1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=raw) || raw;
  lo = Math.floor(lo/step)*step; hi = Math.ceil(hi/step)*step;
  const n = vals.length, cw = (RR-L)/n, sy = v => Tp + (h-Tp-B)*(1-(v-lo)/(hi-lo||1)), sx = i => L + cw*(i+0.5);
  let g = '';
  for(let v=lo; v<=hi+step/1000; v+=step){ g += `<line x1="${L}" x2="${RR}" y1="${sy(v)}" y2="${sy(v)}" stroke="#1f2b40"/><text x="${L-8}" y="${sy(v)+4}" text-anchor="end" style="font:500 10.5px var(--f-ui);fill:var(--faint)">${fmt(v, step<1?1:0)}</text>`; }
  const every = Math.ceil(n/8);
  R.keys.forEach((k,i)=>{ const lastOk = i===n-1 && (n-1)%every >= every*0.6; if(i%every===0 || lastOk) g += `<text x="${sx(i)}" y="${h-10}" text-anchor="middle" style="font:500 10.5px var(--f-ui);fill:var(--muted)">${shortDate(k)}</text>`; });
  const col = {energia:'var(--kcal)',proteine:'var(--prot)',K:'var(--min)',P:'var(--min)',Na:'var(--min)',acqua:'#56c7e8',peso:'var(--accent)'}[par];
  const maxRef = refs.find(r=>r[1]==='Max');
  if(par!=='peso' && n<=62){
    vals.forEach((v,i)=>{ if(v==null) return; const bw = Math.max(cw*0.64,2); g += `<rect x="${sx(i)-bw/2}" y="${sy(v)}" width="${bw}" height="${Math.max(sy(lo)-sy(v),0)}" rx="2" fill="${maxRef&&v>maxRef[0]?'var(--over)':col}"><title>${shortDate(R.keys[i],true)}: ${fmt(v)}</title></rect>`; });
  } else {
    const pts = vals.map((v,i)=>v==null?null:[sx(i),sy(v)]).filter(Boolean);
    if(pts.length>1) g += `<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>`;
    pts.forEach(p=>{ g += `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${col}"/>`; });
  }
  refs.forEach(([v,l,c],j)=>{ g += `<line x1="${L}" x2="${RR}" y1="${sy(v)}" y2="${sy(v)}" stroke="${c}" stroke-dasharray="6 5" stroke-width="1.5"/><text x="${RR+8}" y="${sy(v)+(j?12:-2)}" style="font:700 10.5px var(--f-ui);fill:${c}">${l}</text>`; });
  const unit = TPARAMS.find(p=>p[0]===par);
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${unit[1]} (${unit[2]})">${g}</svg><div class="faint small" style="margin-top:6px">${unit[1]} in ${unit[2]}${par==='peso'?'':', solo i giorni registrati'}</div>`;
}

function expandInto(map, it, mult, depth){
  const f = DB.byId.get(it.id); if(!f) return;
  const g = (+it.g||0)*mult;
  if(f.kind==='recipe' && depth<4){
    const r = S.recipes.find(x=>x.id===f.id), tot = r ? r.items.reduce((a,b)=>a+(+b.g||0),0) : 0;
    if(tot>0){ for(const ri of r.items) expandInto(map, ri, g/tot, depth+1); return; }
  }
  map.set(it.id, (map.get(it.id)||0) + g);
}
function shopList(days){
  const map = new Map();
  for(const d of days) for(const M of MEALS) for(const it of (S.menus[d][M.k]||[])) expandInto(map, it, 1, 0);
  return [...map].map(([id,net])=>{ const f = DB.byId.get(id), e = f.v[I.edibile]; return {id, name:f.disp, net, gross: e>0 && e<100 ? net*100/e : net}; })

}

/* ---------------- CODICE A BARRE (EAN-13 / EAN-8 / UPC-A) ---------------- */
const EAN_L = ['3211','2221','2122','1411','1132','1231','1114','1312','1213','3112'].map(s=>s.split('').map(Number));
const EAN_G = EAN_L.map(w=>w.slice().reverse());
const EAN_PAR = ['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function eanCheck(d){ const n = d.length; let s = 0; for(let i=0;i<n-1;i++) s += d[i]*((n-1-i)%2 ? 3 : 1); return (10 - s%10)%10 === d[n-1]; }
function eanDigit(r, i, tab){
  const T = r[i]+r[i+1]+r[i+2]+r[i+3]; let best = -1, be = 1e9;
  for(let d=0; d<10; d++){ let e = 0; for(let j=0;j<4;j++){ const x = r[i+j]*7/T - tab[d][j]; e += x*x; } if(e<be){ be = e; best = d; } }
  return [best, be];
}
function eanTry(r, s, halfDigits){
  const nRuns = 3 + halfDigits*8 + 5 + 3, nMod = 3 + halfDigits*14 + 5 + 3;
  if(s+nRuns > r.length) return null;
  let tot = 0; for(let i=s;i<s+nRuns;i++) tot += r[i];
  const mod = tot/nMod, g = i => r[i]/mod, guard = i => g(i)>0.35 && g(i)<2.4;
  if(!(guard(s)&&guard(s+1)&&guard(s+2))) return null;
  if(s>0 && r[s-1] < mod*2.5) return null;                         // zona di silenzio
  const digits = []; let par = '', i = s+3;
  for(let k=0;k<halfDigits;k++){
    const [dl,el] = eanDigit(r,i,EAN_L), [dg,eg] = halfDigits===6 ? eanDigit(r,i,EAN_G) : [0,1e9];
    if(Math.min(el,eg) > 0.8) return null;
    if(el<=eg){ digits.push(dl); par += 'L'; } else { digits.push(dg); par += 'G'; }
    i += 4;
  }
  for(let k=0;k<5;k++) if(!guard(i+k)) return null;
  i += 5;
  for(let k=0;k<halfDigits;k++){ const [d,e] = eanDigit(r,i,EAN_L); if(e>0.8) return null; digits.push(d); i += 4; }
  if(!(guard(i)&&guard(i+1)&&guard(i+2))) return null;
  let all = digits;
  if(halfDigits===6){ const f = EAN_PAR.indexOf(par); if(f<0) return null; all = [f, ...digits]; }
  else if(par!=='LLLL') return null;
  return eanCheck(all) ? all.join('') : null;
}
function eanFromLine(line){
  const n = line.length; if(n<60) return null;
  let lo = 255, hi = 0; for(let i=0;i<n;i++){ if(line[i]<lo) lo = line[i]; if(line[i]>hi) hi = line[i]; }
  if(hi-lo < 40) return null;
  const pre = new Float64Array(n+1); for(let i=0;i<n;i++) pre[i+1] = pre[i]+line[i];
  const win = Math.max(8, Math.round(n/30));
  const methods = [i=>(lo+hi)/2, i=>{ const a = Math.max(0,i-win), b = Math.min(n,i+win+1); return (pre[b]-pre[a])/(b-a); }];
  for(const thr of methods){
    for(const rev of [false, true]){
      const lens = [], cols = []; let cur = -1;
      for(let j=0;j<n;j++){ const i = rev ? n-1-j : j, b = line[i] < thr(i) ? 1 : 0; if(b===cur) lens[lens.length-1]++; else { lens.push(1); cols.push(b); cur = b; } }
      for(let s=0;s<lens.length;s++){
        if(cols[s]!==1) continue;
        const c = eanTry(lens, s, 6) || eanTry(lens, s, 4);
        if(c) return c;
      }
    }
  }
  return null;
}
function decodeEAN(img){
  const {width:w, height:h, data} = img;
  for(const f of [0.5,0.44,0.56,0.38,0.62,0.32,0.68,0.26,0.74]){
    const y0 = Math.round(h*f), line = new Float32Array(w);
    for(let dy=-1; dy<=1; dy++){ const y = Math.min(h-1, Math.max(0, y0+dy)); for(let x=0;x<w;x++){ const o = (y*w+x)*4; line[x] += (data[o]*0.299+data[o+1]*0.587+data[o+2]*0.114)/3; } }
    const c = eanFromLine(line); if(c) return c;
  }
  return null;
}
async function decodeImageFile(file){
  const url = URL.createObjectURL(file);
  try{
    const im = new Image(); im.src = url; await im.decode();
    const c = document.createElement('canvas'), x = c.getContext('2d', {willReadFrequently:true});
    for(const maxW of [1400, 900, 2000]){
      for(const rot of [0, 90]){
        const sc = Math.min(1, maxW/(rot ? im.height : im.width)), w = Math.round(im.width*sc), h = Math.round(im.height*sc);
        c.width = rot ? h : w; c.height = rot ? w : h; x.save();
        if(rot){ x.translate(h, 0); x.rotate(Math.PI/2); }
        x.drawImage(im, 0, 0, w, h); x.restore();
        const code = decodeEAN(x.getImageData(0, 0, c.width, c.height)); if(code) return code;
      }
    }
    if('BarcodeDetector' in window){ try{ const r = await new BarcodeDetector({formats:['ean_13','ean_8','upc_a']}).detect(im); if(r && r.length) return r[0].rawValue; }catch(e){} }
  }catch(e){}
  finally{ URL.revokeObjectURL(url); }
  return null;
}
async function startScan(box, onCode){
  const video = document.createElement('video'); video.setAttribute('playsinline',''); video.muted = true; box.appendChild(video);
  let stream = null, alive = true;
  const stop = ()=>{ alive = false; if(stream) stream.getTracks().forEach(t=>t.stop()); video.remove(); };
  try{ stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}}, audio:false}); }
  catch(e){ box.innerHTML = '<div class="banner bad" style="margin:12px">Fotocamera non disponibile o permesso negato: scrivi il codice a mano.</div>'; box.style.aspectRatio = 'auto'; return stop; }
  video.srcObject = stream; try{ await video.play(); }catch(e){}
  let det = null;
  try{ if('BarcodeDetector' in window) det = new BarcodeDetector({formats:['ean_13','ean_8','upc_a']}); }catch(e){ det = null; }
  const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', {willReadFrequently:true});
  let last = null, hits = 0;
  const loop = async ()=>{
    if(!alive) return;
    try{
      let code = null;
      if(det){ const r = await det.detect(video); if(r && r.length) code = r[0].rawValue; }
      if(!code && video.videoWidth){
        const cw = Math.min(video.videoWidth, 1000), ch = Math.round(video.videoHeight*cw/video.videoWidth);
        canvas.width = cw; canvas.height = ch; ctx.drawImage(video, 0, 0, cw, ch);
        code = decodeEAN(ctx.getImageData(0, 0, cw, ch));
      }
      if(code){ hits = code===last ? hits+1 : 1; last = code; if(hits>=2 || det){ stop(); onCode(code); return; } }
    }catch(e){}
    setTimeout(loop, 110);
  };
  loop();
  return stop;
}

function parseCSV(text){
  text = text.replace(/^\uFEFF/,'');
  const first = text.split(/\r?\n/).find(l=>l.trim()) || '';
  const delim = [';','\t',','].map(d=>[d, first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows = []; let row = [], cell = '', q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if(c==='"') q = true;
    else if(c===delim){ row.push(cell); cell = ''; }
    else if(c==='\n' || c==='\r'){ if(c==='\r' && text[i+1]==='\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if(cell || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
const CSV_ALIAS = {edibile:['parte edibile','edibile','edible portion','edible part'], acqua:['acqua','water'], energia:['energia','kcal','energia (kcal)','calorie','energy','energy (kcal)'],
  proteine:['proteine','proteine totali','protein','proteins'], lipidi:['lipidi','lipidi totali','grassi','fat','total fat'], polinsaturi:['polinsaturi','polinsaturi totali','polyunsaturated','polyunsaturated fat'],
  colesterolo:['colesterolo','cholesterol'], glucidi:['glucidi disponibili','glucidi dispon.','glucidi','carboidrati','available carbohydrates','carbohydrate','carbohydrates'],
  glucidiSol:['glucidi solubili','zuccheri','sugars','total sugars'], fibra:['fibra','fibra alimentare','fibra totale','fibre','fiber','aoac fibre'], Fe:['fe','ferro','iron'], Ca:['ca','calcio','calcium'],
  Na:['na','sodio','sodium'], K:['k','potassio','potassium'], P:['p','fosforo','phosphorus'], Zn:['zn','zinco','zinc'], vitC:['vit. c','vitamina c','vit c','vitamin c'],
  vitB6:['vit. b6','vitamina b6','vit b6','vitamin b6'], folati:['acido folico','folati','folico','folate','folic acid'], vitD:['vit. d','vitamina d','vit d','vitamin d'],
  Mg:['mg','magnesio','magnesium'], Na2:['sodio aggiunto','na aggiunto','added sodium'], niacina:['niacina','niacin']};
const csvNum = s => { s = String(s||'').trim().replace(/\s/g,''); if(!s || /^tr/i.test(s)) return 0; if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.'); const x = parseFloat(s); return isFinite(x) ? x : NaN; };
function importCSV(text){
  const rows = parseCSV(text).filter(r=>r.some(c=>String(c).trim()));
  let map = null, hdr = -1;
  for(let r=0; r<Math.min(6, rows.length); r++){
    const m = {}; let hits = 0;
    rows[r].forEach((c,ci)=>{ const h = String(c).trim().toLowerCase().replace(/\s+/g,' ');
      for(const k in CSV_ALIAS) if(CSV_ALIAS[k].includes(h)){ const key = (k==='Na' && m.Na!=null) ? 'Na2' : k; if(m[key]==null){ m[key] = ci; hits++; } break; } });
    if(hits>=5){ map = m; hdr = r; break; }
  }
  const EN_NAME = ['nome inglese','nome in inglese','english name','name (en)','nome (en)','name en','inglese','english'];
  const enCol = hdr>=0 ? rows[hdr].findIndex(c=>EN_NAME.includes(String(c).trim().toLowerCase().replace(/\s+/g,' '))) : -1;   // colonna facoltativa con il nome inglese
  if(!map){ map = {}; NUT.forEach((n,i)=>{ map[n.k] = i+1; }); }
  const baseByKey = new Map(RAW.map(r=>[norm(pretty(r[0])), r[0]]));
  const baseRow = new Map(RAW.map(r=>[r[0], r]));
  const customByKey = new Map(S.custom.map(c=>[norm(c.name), c]));
  let upd = 0, add = 0, skip = 0;
  for(let r=hdr+1; r<rows.length; r++){
    const row = rows[r], name = String(row[0]||'').replace(/\s+/g,' ').trim();
    if(!name){ skip++; continue; }
    const en = enCol>=0 ? String(row[enCol]||'').replace(/\s+/g,' ').trim() : '';
    const key = norm(pretty(name)), base = baseByKey.get(key), c = base ? null : (customByKey.get(norm(name)) || (en ? customByKey.get(norm(en)) : null));
    const prev = base ? (S.baseOver[base] || baseRow.get(base).slice(1)) : c ? c.v : null;   // colonne assenti: restano i valori attuali
    const v = NUT.map((n,i)=> map[n.k]!=null ? csvNum(row[map[n.k]]) : prev ? prev[i] : (n.k==='edibile' ? 100 : 0));
    if(v.filter(x=>!isNaN(x)).length < 3 || NUT.every((n,i)=>!(v[i]>0) || n.k==='edibile')){ skip++; continue; }
    for(let i=0;i<NV;i++) if(isNaN(v[i])) v[i] = prev ? prev[i] : 0;
    if(base){ S.baseOver[base] = v; upd++; continue; }
    if(c){ c.v = v; if(en){ c.name = name; c.en = en; } upd++; }   // già presente (anche se importato col nome inglese): si aggiorna senza doppioni
    else { const nc = {id:uid('c'), name, v, imp:1}; if(en) nc.en = en; S.custom.push(nc); customByKey.set(norm(name), nc); if(en) customByKey.set(norm(en), nc); add++; }
  }
  buildDB(); save(); render();
  openSheet('Importazione completata', `<p class="help" style="font-size:14.5px;color:var(--muted)">${upd} ${upd===1?'alimento aggiornato':'alimenti aggiornati'}, ${add} ${add===1?'alimento nuovo aggiunto':'alimenti nuovi aggiunti'}, ${skip} ${skip===1?'riga ignorata':'righe ignorate'} (vuote o senza valori).</p>`, `<button class="btn pri" data-act="close">Ok</button>`);
}

const SYNC_KEY = 'bilancioMenu.sync';

function b64utf8(b){ const bin = atob(String(b).replace(/\s/g,'')), u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); }
function mergeStates(loc, rem){
  const lt = (loc.meta&&loc.meta.updatedAt)||0, rt = (rem.meta&&rem.meta.updatedAt)||0, newer = rt > lt ? rem : loc, older = newer===loc ? rem : loc;
  const out = JSON.parse(JSON.stringify(newer));
  const d = {};
  for(const src of [older.diary||{}, newer.diary||{}]) for(const k in src){ if(!d[k] || (src[k].t||0) >= (d[k].t||0)) d[k] = src[k]; }
  out.diary = d;
  const w = {};
  for(const src of [older.weights||[], newer.weights||[]]) for(const x of src){ if(!w[x.d] || (x.t||0) >= (w[x.d].t||0)) w[x.d] = x; }
  out.weights = Object.values(w).sort((a,b)=>a.d.localeCompare(b.d));
  out.meta = {updatedAt: Math.max(lt, rt)};
  return out;
}
const ghErr = st => ({401:'token non valido o scaduto', 403:'il token non ha i permessi di scrittura', 404:'repository non trovato'})[st] || ('errore '+st);
async function ghReq(cfg, method, body, raw){

async function syncNow(manual){
  const cfg = syncCfg(); if(!cfg.repo || !cfg.token) return;
  if(syncSt.busy){ syncSt.again = true; return; }
  syncSt.busy = true; syncSt.err = null; syncDot();
  try{
    for(let attempt=0; attempt<3; attempt++){
      const g = await ghReq(cfg, 'GET');
      let remote = null, sha = null;
      if(g.status===200){
        const j = await g.json(); sha = j.sha;
        let txt;
        if(j.content && j.encoding!=='none') txt = b64utf8(j.content);
        else { const g2 = await ghReq(cfg, 'GET', null, true); if(!g2.ok) throw new Error(ghErr(g2.status)); txt = await g2.text(); }   // file oltre 1 MB
        remote = JSON.parse(txt);
      }
      else if(g.status!==404) throw new Error(ghErr(g.status));
      const local = JSON.parse(JSON.stringify(S)); delete local.ui;
      const merged = remote && remote.app==='bilancio-menu' ? mergeStates(local, remote) : local;
      if(dataPart(merged) !== dataPart(local)) applyMerged(merged);
      if(!remote || dataPart(remote) !== dataPart(merged) || (remote.meta&&remote.meta.updatedAt)!==merged.meta.updatedAt){
        const out = JSON.parse(JSON.stringify(merged)); delete out.ui;
        const p = await ghReq(cfg, 'PUT', Object.assign({message:'Bilancio Menù: sincronizzazione', content:utf8b64(JSON.stringify(out))}, sha ? {sha} : {}));
        if(p.status===409 || p.status===422) continue;          // un altro dispositivo ha scritto nel frattempo: riprova
        if(!p.ok) throw new Error(ghErr(p.status));
      }
      cfg.last = Date.now(); syncStore(cfg);
      if(manual) toast('Sincronizzazione completata');
      break;
    }
  }catch(e){ syncSt.err = e.message || String(e); if(manual) toast('Sincronizzazione non riuscita: '+syncSt.err); }
  finally{
    syncSt.busy = false; syncDot();
    const st = $('#sy-st'); if(st) st.textContent = syncStatusText();
    if(syncSt.again){ syncSt.again = false; setTimeout(()=>syncNow(), 400); }
  }
}

/* ---------------- TRADUZIONE (italiano -> inglese) ---------------- */
const ORIG = new WeakMap(), ORIGA = new WeakMap(), TR_SKIP = 'script,style,textarea,.nm,[data-nt]';
const PROPER = new Set(['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday','Mon','Tue','Wed','Thu','Fri','Sat','Sun']);
function trWord(w){
  if(w==null) return '';
  const t = EN[w] ?? EN[cap1(w)];
  if(t!=null) return (w[0] && w[0]===w[0].toLowerCase() && w[0]!==w[0].toUpperCase() && !PROPER.has(t)) ? t.charAt(0).toLowerCase()+t.slice(1) : t;
  return tr(w);
}
const TR_CACHE = new Map(), NO_WORDS = /^[\d\s.,:;%+\-−–—/()×=<>≤≥~*·'"°]*$/;
function tr(s){
  if(LANG!=='en' || s==null) return s;
  const str = String(s);
  let r = TR_CACHE.get(str);
  if(r===undefined){ r = NO_WORDS.test(str) ? str : trRaw(str); if(TR_CACHE.size > 20000) TR_CACHE.clear(); TR_CACHE.set(str, r); }
  return r;
}
function trRaw(str){
  const k = str.trim(); if(!k) return str;
  let out = EN[k];
  if(out==null) for(const [re, t] of EN_PAT){ const m = k.match(re); if(m){ out = t.replace(/\$(\d)/g, (x,i)=>trWord(m[+i]||'')).replace(/\u0000(\d)/g, (x,i)=>m[+i]||''); break; } }
  if(out==null && k.includes(', ')){                         // frasi composte da parti separate da virgole
    const parts = k.split(', '), tp = parts.map(x=>tr(x));
    if(tp.some((x,i)=>x!==parts[i])) out = tp.join(', ');
  }
  return out==null ? str : str.replace(k, out);
}
function trNode(n){ if(!ORIG.has(n)) ORIG.set(n, n.data); const o = ORIG.get(n), t = LANG==='en' ? tr(o) : o; if(n.data!==t) n.data = t; }
function trEl(el){
  for(const a of ['placeholder','title','aria-label']){
    if(!el.hasAttribute(a)) continue;
    let m = ORIGA.get(el); if(!m){ m = {}; ORIGA.set(el, m); }
    if(!(a in m)) m[a] = el.getAttribute(a);
    const t = LANG==='en' ? tr(m[a]) : m[a]; if(el.getAttribute(a)!==t) el.setAttribute(a, t);
  }
}
function translateDOM(root){
  if(!root) return;
  if(root.nodeType===3){ if(root.parentElement && !root.parentElement.closest(TR_SKIP)) trNode(root); return; }
  if(root.nodeType!==1 || root.closest(TR_SKIP)) return;
  trEl(root);
  root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>{ if(!el.closest(TR_SKIP)) trEl(el); });
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode:n=>(n.parentElement && n.parentElement.closest(TR_SKIP)) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
  let n; while((n = w.nextNode())) trNode(n);
}
new MutationObserver(ms=>{ if(LANG!=='en') return; for(const m of ms) for(const n of m.addedNodes) translateDOM(n); }).observe(document.body, {childList:true, subtree:true});
function setLang(l){
  LANG = S.ui.lang = (l==='en' ? 'en' : 'it');
  document.documentElement.lang = LANG;
  buildDB(); save(); render(); translateDOM(document.body); updateWidget();
}

const TRIAL_K = [80, 220, 243, 139, 62, 170, 77, 248, 184, 166, 191, 79, 247, 124, 95, 83, 173, 225, 11, 201, 117, 152, 96, 59, 246, 227, 105, 100, 139, 199, 118, 144], TRIAL_E = [56, 144, 187, 205, 119, 200, 61, 213, 205, 210, 134, 60, 131, 43, 107, 54, 222, 141, 103, 163, 34, 240, 11, 110, 132, 146, 45, 6, 227, 175, 15, 161];
/* ================= VERSIONE DI PROVA: funzioni comuni all'app e al generatore di codici ================= */
/* SHA-256 e HMAC-SHA256 in JavaScript puro: funzionano anche dove WebCrypto non è disponibile */
const TRIAL_CORE = (()=>{
  const K256 = new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
  const utf8 = s => new TextEncoder().encode(s);
  function sha256(bytes){
    const n = bytes.length, len = ((n + 9 + 63) >> 6) << 6, m = new Uint8Array(len);
    m.set(bytes); m[n] = 0x80;
    const dv = new DataView(m.buffer); dv.setUint32(len-4, (n*8)>>>0); dv.setUint32(len-8, Math.floor(n/0x20000000));
    const H = new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]), W = new Uint32Array(64);
    const r = (x,k)=>(x>>>k)|(x<<(32-k));
    for(let o=0; o<len; o+=64){
      for(let i=0;i<16;i++) W[i] = dv.getUint32(o+i*4);
      for(let i=16;i<64;i++){ const a=W[i-15], b=W[i-2]; W[i] = (W[i-16] + (r(a,7)^r(a,18)^(a>>>3)) + W[i-7] + (r(b,17)^r(b,19)^(b>>>10)))>>>0; }
      let [a,b,c,d,e,f,g,h] = H;
      for(let i=0;i<64;i++){
        const t1 = (h + (r(e,6)^r(e,11)^r(e,25)) + ((e&f)^(~e&g)) + K256[i] + W[i])>>>0;
        const t2 = ((r(a,2)^r(a,13)^r(a,22)) + ((a&b)^(a&c)^(b&c)))>>>0;
        h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0;
      }
      H[0]+=a; H[1]+=b; H[2]+=c; H[3]+=d; H[4]+=e; H[5]+=f; H[6]+=g; H[7]+=h;
    }
    const out = new Uint8Array(32), ov = new DataView(out.buffer); H.forEach((x,i)=>ov.setUint32(i*4, x)); return out;
  }
  function hmac(key, msg){
    let k = key.length > 64 ? sha256(key) : key; const kb = new Uint8Array(64); kb.set(k);
    const ip = new Uint8Array(64+msg.length), op = new Uint8Array(64+32);
    for(let i=0;i<64;i++){ ip[i] = kb[i]^0x36; op[i] = kb[i]^0x5c; }
    ip.set(msg, 64); op.set(sha256(ip), 64); return sha256(op);
  }
  const B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';          // base32 di Crockford: niente I, L, O, U (si confondono)
  function b32(bytes){ let bits = 0, val = 0, s = ''; for(const x of bytes){ val = (val<<8)|x; bits += 8; while(bits>=5){ s += B32[(val>>>(bits-5))&31]; bits -= 5; } val &= (1<<bits)-1; } return s; }
  const key = () => utf8(String.fromCharCode(...TRIAL_E.map((x,i)=>x^TRIAL_K[i])));
  /* codice dispositivo: 8 caratteri ricavati dall'identificativo del telefono */
  const deviceCode = raw => { const c = b32(sha256(utf8('BM-dispositivo|'+raw))).slice(0,8); return c.slice(0,4)+'-'+c.slice(4); };
  const normDev = s => String(s||'').toUpperCase().replace(/[^0-9A-Z]/g,'').replace(/O/g,'0').replace(/[IL]/g,'1').slice(0,8).replace(/^(.{4})(.+)$/,'$1-$2');
  /* codice di attivazione: P = definitivo, E<n> = proroga numero n (ogni proroga vale una volta sola) */
  const mac = (dev, payload) => b32(hmac(key(), utf8(normDev(dev)+'|'+payload))).slice(0,12);
  const makeCode = (dev, payload) => { const m = mac(dev, payload); return payload+'-'+m.slice(0,4)+'-'+m.slice(4,8)+'-'+m.slice(8); };
  function parseCode(s){
    let c = String(s||'').toUpperCase().replace(/[\s_.]/g,'').replace(/O/g,'0').replace(/[IL]/g,'1');
    const flat = c.replace(/-/g,''); if(flat.length < 13) return null;
    const payload = flat.slice(0, flat.length-12), m = flat.slice(-12);
    if(payload==='P') return {type:'P', payload, mac:m};
    const e = payload.match(/^E([1-9]\d{0,2})$/); if(e) return {type:'E', n:+e[1], payload:'E'+(+e[1]), mac:m};
    return null;
  }
  function checkCode(dev, s){ const p = parseCode(s); if(!p) return null; return mac(dev, p.payload)===p.mac ? p : null; }
  return {sha256, hmac, b32, utf8, deviceCode, normDev, makeCode, parseCode, checkCode};
})();

/* ================= VERSIONE DI PROVA: 14 giorni, poi blocco; codici di proroga (+14 giorni) e definitivo ================= */
const TRIAL = (()=>{
  const DAY = 86400000, DAYS = 14, EXT = 14;
  const HARD_END = new Date(2027, 5, 30, 23, 59, 59).getTime();   // oltre questa data una nuova installazione non parte senza codice
  const KEY = 'bilancioMenu.prova', DEVKEY = 'bilancioMenu.dispositivo';
  const bridge = () => (window.AndroidBridge && typeof AndroidBridge.getTrial==='function') ? AndroidBridge : null;

  function rawDevice(){
    try{ if(window.AndroidBridge && typeof AndroidBridge.getDeviceId==='function'){ const id = AndroidBridge.getDeviceId(); if(id) return id; } }catch(e){}
    let id = null; try{ id = localStorage.getItem(DEVKEY); }catch(e){}
    if(!id){ id = 'web-' + Math.random().toString(36).slice(2) + Date.now().toString(36); try{ localStorage.setItem(DEVKEY, id); }catch(e){} }
    return id;
  }
  const DEV = TRIAL_CORE.deviceCode(rawDevice());

  const parse = s => { try{ const o = JSON.parse(s||''); return o && o.v===1 && isFinite(o.start) && isFinite(o.exp) ? o : null; }catch(e){ return null; } };
  function load(){
    let a = null, b = null;
    try{ a = parse(localStorage.getItem(KEY)); }catch(e){}
    try{ const br = bridge(); if(br) b = parse(br.getTrial()); }catch(e){}
    if(a && b) return {v:1, start:Math.min(a.start,b.start), exp:Math.max(a.exp,b.exp), last:Math.max(a.last||0,b.last||0),
                       used:[...new Set([...(a.used||[]), ...(b.used||[])])], perm:!!(a.perm||b.perm)};
    return a || b;
  }
  function store(){
    const s = JSON.stringify(st);
    try{ localStorage.setItem(KEY, s); }catch(e){}
    try{ const br = bridge(); if(br) br.setTrial(s); }catch(e){}
  }
  let st = load();
  if(!st){ const now = Date.now(); st = {v:1, start:now, exp:Math.min(now + DAYS*DAY, HARD_END), last:now, used:[], perm:false}; }
  /* l'orologio del telefono non può tornare indietro: si usa il momento più avanzato già visto */
  function now(){ const t = Math.max(Date.now(), st.last||0); if(t !== st.last){ st.last = t; store(); } return t; }
  now(); store();

  const locked = () => !st.perm && now() > st.exp;
  const daysLeft = () => Math.max(0, Math.ceil((st.exp - now())/DAY));
  const dstr = t => new Date(t).toLocaleDateString(loc(), {day:'numeric', month:'long', year:'numeric'});

  function activate(input){
    const p = TRIAL_CORE.checkCode(DEV, input);
    if(!p) return {ok:false, msg:'Codice non valido per questo dispositivo'};
    if(p.type==='P'){ if(st.perm) return {ok:true, msg:'La versione completa è già attiva'}; st.perm = true; store(); return {ok:true, msg:'Versione completa attivata. Grazie!'}; }
    if(st.perm) return {ok:true, msg:'La versione completa è già attiva'};
    if((st.used||[]).includes(p.n)) return {ok:false, msg:'Questo codice è già stato usato'};
    st.used = [...(st.used||[]), p.n]; st.exp = Math.max(st.exp, now()) + EXT*DAY; store();
    return {ok:true, msg:`Prova prolungata fino al ${dstr(st.exp)}`};
  }
  return {DEV, locked, daysLeft, activate, get state(){ return st; }, dstr, HARD_END};
})();

/* ---- blocco del salvataggio e della sincronizzazione ---- */
{
  const _save = save;          save = function(){ if(TRIAL.locked()) return; return _save.apply(this, arguments); };
  const _sync = syncNow;       syncNow = function(){ if(TRIAL.locked()) return Promise.resolve(); return _sync.apply(this, arguments); };
  const _async = androidSync;  androidSync = function(){
    if(TRIAL.locked()){ try{ if(window.AndroidBridge && AndroidBridge.setReminders) AndroidBridge.setReminders('[]'); }catch(e){} return; }   // niente promemoria a prova scaduta
    return _async.apply(this, arguments);
  };
  const _render = render;      render = function(){ const r = _render.apply(this, arguments); trialDecorate(); return r; };
}

function trialShareDevice(){
  const text = `Codice dispositivo di Bilancio Menù Prova: ${TRIAL.DEV}`;
  if(window.AndroidBridge && typeof AndroidBridge.shareText==='function'){ AndroidBridge.shareText(tr(text), '', false); return; }
  if(navigator.clipboard) navigator.clipboard.writeText(TRIAL.DEV).then(()=>toast('Codice dispositivo copiato'), ()=>{});
}
function trialTry(inp){
  const v = inp && inp.value.trim(); if(!v){ toast('Scrivi il codice di attivazione'); inp && inp.focus(); return; }
  const r = TRIAL.activate(v); toast(r.msg);
  const m = document.getElementById(inp.id.replace('-code','-msg')); if(m){ m.textContent = r.ok ? '' : tr(r.msg); }
  if(r.ok){ inp.value = ''; trialLock(false); _saveAfterUnlock(); render(); }
}
function _saveAfterUnlock(){ try{ save(); }catch(e){} }

function trialDecorate(){
  const st = TRIAL.state, full = st.perm, left = TRIAL.daysLeft();
  const cv = document.getElementById('credit-v');
  if(cv) cv.textContent = full ? `versione ${APP.versione}` : `versione ${APP.versione} · prova`;
  /* striscia nella pagina Oggi */
  const today = document.getElementById('p-today');
  let bn = document.getElementById('trial-banner');
  if(today && !full){
    if(!bn){ bn = document.createElement('div'); bn.id = 'trial-banner'; today.prepend(bn); }
    const warn = left <= 3;
    bn.className = 'banner ' + (warn ? 'bad' : 'info');
    bn.style.cssText = 'margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap';
    bn.innerHTML = `<span style="flex:1;min-width:180px">${left===1 ? 'Versione di prova: ultimo giorno' : `Versione di prova: restano ${left} giorni`}</span><button class="btn sm" data-trial-open>Attiva</button>`;
  } else if(bn) bn.remove();
  /* pannello nel Profilo */
  const prof = document.getElementById('profile');
  if(prof && S.ui.page==='profile'){
    let pn = document.getElementById('trial-panel');
    if(!pn){ pn = document.createElement('div'); pn.id = 'trial-panel'; pn.className = 'panel pad'; }
    if(prof.firstChild !== pn) prof.prepend(pn);
    pn.innerHTML = full
      ? `<div class="head"><h2>Attivazione</h2><span class="rule"></span></div><p class="help">Versione completa attivata su questo dispositivo.</p>`
      : `<div class="head"><h2>Versione di prova</h2><span class="rule"></span></div>
         <p class="help" style="margin-bottom:12px">${left===1 ? 'Ultimo giorno di prova' : `Restano ${left} giorni di prova`}, fino al ${TRIAL.dstr(st.exp)}. Per continuare serve un codice di attivazione: invia il codice dispositivo a Giorgio Armosini.</p>
         ${trialCodeBlock('tp')}`;
  }
  if(TRIAL.locked()) trialLock(true);
}
function trialCodeBlock(p){
  return `<div class="row" style="gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
      <span class="faint small">Codice dispositivo</span><b class="num" data-nt style="font-size:18px;letter-spacing:.08em">${TRIAL.DEV}</b>
      <button class="btn sm" data-trial-share>Invia</button></div>
    <div class="row" style="gap:10px;flex-wrap:wrap"><input class="in" id="${p}-code" placeholder="Codice di attivazione" autocomplete="off" autocapitalize="characters" spellcheck="false" style="flex:1;min-width:190px;text-transform:uppercase" data-nt>
      <button class="btn pri" data-trial-go="${p}-code">Attiva</button></div>
    <div id="${p}-msg" role="alert" style="color:var(--over);font-size:13px;margin-top:8px;min-height:1em"></div>`;
}
function trialLock(on){
  let ov = document.getElementById('trial-lock');
  if(!on){ if(ov) ov.remove(); return; }
  if(ov) return;
  ov = document.createElement('div'); ov.id = 'trial-lock'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true');
  ov.innerHTML = `<div class="tl-box">
    <div class="tl-ic">⏳</div>
    <h2>Periodo di prova terminato</h2>
    <p>La prova di Bilancio Menù è scaduta: da ora i dati non vengono più salvati. I tuoi dati restano sul telefono e tornano disponibili appena inserisci un codice di attivazione.</p>
    <p>Per ricevere un codice invia il codice dispositivo a Giorgio Armosini.</p>
    ${trialCodeBlock('tl')}
    <button class="btn quiet" data-trial-backup style="margin-top:16px">Salva una copia dei miei dati</button>
  </div>`;
  document.body.appendChild(ov);
  try{ document.activeElement && document.activeElement.blur(); }catch(e){}
  closeSheet && closeSheet();
}
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-trial-open],[data-trial-share],[data-trial-go],[data-trial-backup]'); if(!t) return;
  if(t.hasAttribute('data-trial-open')){ go('profile'); return; }
  if(t.hasAttribute('data-trial-share')){ trialShareDevice(); return; }
  if(t.hasAttribute('data-trial-go')){ trialTry(document.getElementById(t.dataset.trialGo)); return; }
  if(t.hasAttribute('data-trial-backup')){ saveBytes(new TextEncoder().encode(backupText()), `BilancioMenu_backup_${stamp()}.json`, 'application/json'); if(!window.AndroidBridge) toast('Copia dei dati salvata'); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target && /^(tp|tl)-code$/.test(e.target.id)) trialTry(e.target); });
{
  const css = document.createElement('style');
  css.textContent = `#trial-lock{position:fixed;inset:0;z-index:9999;background:rgba(6,10,18,.94);display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) 18px max(20px,env(safe-area-inset-bottom,0px));overflow:auto}
  #trial-lock .tl-box{max-width:460px;width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:24px 22px}
  #trial-lock .tl-ic{font-size:34px;margin-bottom:6px}
  #trial-lock h2{font-family:var(--f-disp);font-size:21px;margin:0 0 10px;color:var(--tx)}
  #trial-lock p{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 12px}
  body:has(#trial-lock) .toast{z-index:10000}
  #tp-code::placeholder,#tl-code::placeholder{text-transform:none;letter-spacing:0}`;
  document.head.appendChild(css);
}
