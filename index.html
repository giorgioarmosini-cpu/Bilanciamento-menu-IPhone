<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Bilancio Menù Prova</title>
<meta name="theme-color" content="#0d1320">
<meta name="author" content="Giorgio Armosini">
<meta name="application-name" content="Bilancio Menù 1.1.1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bilancio Menù">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2040%2040%22%3E%3Crect%20width%3D%2240%22%20height%3D%2240%22%20rx%3D%2211%22%20fill%3D%22%23172237%22/%3E%3Ccircle%20cx%3D%2220%22%20cy%3D%2220%22%20r%3D%2212%22%20fill%3D%22none%22%20stroke%3D%22%230d1320%22%20stroke-width%3D%225.5%22/%3E%3Ccircle%20cx%3D%2220%22%20cy%3D%2220%22%20r%3D%2212%22%20fill%3D%22none%22%20stroke%3D%22%234fd1a5%22%20stroke-width%3D%225.5%22%20stroke-dasharray%3D%2217%2058.4%22%20transform%3D%22rotate%28-90%2020%2020%29%22/%3E%3Ccircle%20cx%3D%2220%22%20cy%3D%2220%22%20r%3D%2212%22%20fill%3D%22none%22%20stroke%3D%22%23f5b041%22%20stroke-width%3D%225.5%22%20stroke-dasharray%3D%2222%2053.4%22%20stroke-dashoffset%3D%22-18.5%22%20transform%3D%22rotate%28-90%2020%2020%29%22/%3E%3Ccircle%20cx%3D%2220%22%20cy%3D%2220%22%20r%3D%2212%22%20fill%3D%22none%22%20stroke%3D%22%236f9dff%22%20stroke-width%3D%225.5%22%20stroke-dasharray%3D%2228%2047.4%22%20stroke-dashoffset%3D%22-42%22%20transform%3D%22rotate%28-90%2020%2020%29%22/%3E%3Ccircle%20cx%3D%2220%22%20cy%3D%2220%22%20r%3D%224%22%20fill%3D%22%23e9eff8%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --ink:#0d1320; --ink2:#0a0f19;
  --panel:#151e2d; --panel2:#19243a; --panel3:#20304a;
  --line:#243249; --line2:#30435f;
  --tx:#e9eff8; --muted:#a1b1c8; --faint:#6f829e;
  --prot:#4fd1a5; --lip:#f5b041; --glu:#6f9dff; --fib:#b48cff; --kcal:#ff6e8a; --min:#56c7e8;
  --ok:#4fd18b; --warn:#ffc857; --over:#ff6464; --neutral:#8aa0bf;
  --accent:#4fd1a5;
  --f-disp:'Space Grotesk','Segoe UI Variable Display','Segoe UI',Roboto,system-ui,sans-serif;
  --f-ui:'IBM Plex Sans','Segoe UI Variable Text','Segoe UI',Roboto,system-ui,sans-serif;
  --navh:64px;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--ink)}
body{
  margin:0;min-height:100%;font:15px/1.45 var(--f-ui);color:var(--tx);
  background:
    radial-gradient(1100px 520px at 88% -8%,rgba(79,209,165,.09),transparent 62%),
    radial-gradient(900px 480px at -8% 4%,rgba(111,157,255,.08),transparent 58%),
    var(--ink);
  background-attachment:fixed;
  font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,.disp{font-family:var(--f-disp);letter-spacing:-.012em;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid var(--ink)}
::-webkit-scrollbar-track{background:transparent}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;
  padding:20px 14px 16px;background:linear-gradient(180deg,#131b2a,#0f1623);
  border-right:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px}
.mark{width:38px;height:38px;flex:0 0 38px}
.brand b{display:block;font:600 17px/1.1 var(--f-disp)}
.brand small{display:block;color:var(--faint);font-size:11.5px;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:11px 12px;border:0;border-radius:11px;background:transparent;
  color:var(--muted);font-weight:500;font-size:14.5px;transition:background .15s,color .15s;
}
.nav svg{width:19px;height:19px;flex:0 0 19px}
.nav button:hover{background:#1a2438;color:var(--tx)}
.nav button[aria-current="page"]{background:linear-gradient(90deg,rgba(79,209,165,.17),rgba(79,209,165,.02));color:#fff}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.side .credit{margin-top:auto;padding:14px 10px 2px;border-top:1px solid var(--line);font-size:12px;color:var(--faint);line-height:1.5}
.side .credit strong{display:block;color:var(--muted);font-weight:600}

.main{min-width:0;display:flex;flex-direction:column}
.top{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:14px clamp(16px,3vw,32px);
  background:rgba(13,19,32,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.top h1{font-size:20px;font-weight:600}
.top .hint{color:var(--faint);font-size:12.5px;margin-top:2px}
.grow{flex:1 1 auto}
.content{padding:clamp(16px,3vw,32px);max-width:1240px;width:100%}
.page{display:none}
.page.on{display:block;animation:enter .22s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- controls ---------- */
.seg{display:inline-flex;gap:3px;padding:4px;background:var(--ink2);border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:7px 12px;border-radius:9px;min-width:38px;position:relative}
.seg button:hover{color:var(--tx)}
.seg button[aria-pressed="true"]{background:var(--panel3);color:#fff;box-shadow:inset 0 0 0 1px var(--line2)}
.seg.days button[aria-pressed="true"]{background:var(--accent);color:#06140f;box-shadow:0 3px 10px rgba(79,209,165,.28)}
.seg.days button .pip{position:absolute;right:5px;top:5px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.seg.days button[aria-pressed="true"] .pip{background:#06140f}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);background:var(--panel3);
  padding:9px 14px;border-radius:10px;font-weight:600;font-size:13.5px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn svg{width:16px;height:16px}
.btn:hover{border-color:#46618a;background:#253754}
.btn.pri{background:var(--accent);border-color:transparent;color:#06140f}
.btn.pri:hover{background:#6ee0b9}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted)}
.btn.quiet:hover{background:#1b2740;color:var(--tx)}
.btn.bad{background:transparent;border-color:#5b2a33;color:#ffb0b5}
.btn.bad:hover{background:#34181e;border-color:var(--over)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;border:0;background:transparent;color:var(--faint)}
.iconbtn:hover{background:#1e2a42;color:var(--tx)}
.iconbtn.del:hover{background:#3a1a21;color:#ff9aa2}
.iconbtn svg{width:17px;height:17px}
.fld{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin:0 0 6px}
.in{width:100%;background:var(--ink2);border:1px solid var(--line2);padding:10px 12px;border-radius:10px;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
.in::placeholder{color:#55677f}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,209,165,.16)}
.in.num{text-align:right}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.gin{width:74px;padding:6px 8px;text-align:right;border-radius:8px;font-size:14px}

/* ---------- surfaces ---------- */
.panel{background:linear-gradient(180deg,var(--panel),#131b29);border:1px solid var(--line);border-radius:16px}
.pad{padding:18px}
.stack{display:grid;gap:18px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.head{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.head h2{font-size:16.5px;font-weight:600}
.head .rule{flex:1;height:1px;background:var(--line)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.small{font-size:12.5px}
.help{color:var(--faint);font-size:13px;line-height:1.55;max-width:70ch}
.sw{display:inline-block;width:9px;height:9px;border-radius:3px;vertical-align:1px;margin-right:6px}

/* ---------- menu page ---------- */
.daygrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.summary{position:sticky;top:86px}
.plate{display:grid;place-items:center;padding:8px 0 4px}
.plate svg{width:220px;height:220px;overflow:visible}
.plate .big{font:700 40px/1 var(--f-disp);fill:var(--tx)}
.plate .lbl{font:500 12.5px var(--f-ui);fill:var(--faint)}
.macros{display:grid;gap:11px;margin-top:10px}
.mrow{display:grid;grid-template-columns:118px 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.mrow .bar{height:8px;border-radius:6px;background:#0d1522;overflow:hidden;position:relative}
.mrow .bar i{position:absolute;inset:0 auto 0 0;border-radius:6px}
.mrow .v{text-align:right;min-width:92px;color:var(--muted)}
.mrow .v b{color:var(--tx);font-weight:600}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600}
.meal{margin-bottom:16px;overflow:hidden}
.meal-h{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.meal-h h3{font-size:16px;font-weight:600}
.meal-h .quota{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--faint)}
.quota .gauge{width:92px;height:6px;border-radius:5px;background:#0d1522;overflow:hidden}
.quota .gauge i{display:block;height:100%;border-radius:5px;background:var(--kcal)}
.items{width:100%;border-collapse:collapse;font-size:14px}
.items th{font-weight:600;font-size:11.5px;color:var(--faint);text-align:right;padding:8px 8px;white-space:nowrap}
.items th:first-child{text-align:left;padding-left:16px}
.items td{padding:7px 8px;text-align:right;border-top:1px solid #1d293d;white-space:nowrap}
.items td:first-child{text-align:left;padding-left:16px;white-space:normal;width:44%}
.items tr:hover td{background:rgba(255,255,255,.015)}
.items .nm{font-weight:500;line-height:1.3}
.tag{font-size:10.5px;font-weight:700;color:#06140f;background:var(--fib);padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:1px}
.tag.cst{background:var(--min)}
.items tfoot td{font-weight:700;border-top:1px solid var(--line2);color:var(--tx)}
.items td.act{width:40px;padding-right:10px}
.add-row{display:flex;gap:8px;padding:10px 16px 14px;flex-wrap:wrap}
.empty{padding:14px 16px 4px;color:var(--faint);font-size:13.5px}
.tblwrap{overflow-x:auto}
.c-prot{color:var(--prot)} .c-lip{color:var(--lip)} .c-glu{color:var(--glu)} .c-fib{color:var(--fib)} .c-kcal{color:var(--kcal)} .c-min{color:var(--min)}

/* ---------- week page ---------- */
.wk-top{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px}
.donut svg{width:190px;height:190px}
.legend{display:grid;gap:9px;font-size:13.5px}
.legend div{display:flex;align-items:center;gap:8px}
.legend b{margin-left:auto;font-weight:600}
.chart svg{width:100%;height:auto;display:block}
.params{width:100%;border-collapse:collapse;font-size:14px}
.params th{font-size:11.5px;font-weight:600;color:var(--faint);text-align:right;padding:8px 10px;white-space:nowrap}
.params th:first-child{text-align:left}
.params td{padding:9px 10px;border-top:1px solid #1d293d;text-align:right;white-space:nowrap}
.params td:first-child{text-align:left;white-space:normal}
.params .unit{color:var(--faint);font-size:12px;margin-left:3px}
.pbar{width:130px;height:7px;background:#0d1522;border-radius:5px;position:relative;display:inline-block;vertical-align:middle}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.pbar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:#dce6f5;opacity:.55;text-decoration:none}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.ok{color:var(--ok);background:rgba(79,209,139,.1)}
.st.warn{color:var(--warn);background:rgba(255,200,87,.1)}
.st.over{color:var(--over);background:rgba(255,100,100,.12)}
.st.low{color:#8fb4ff;background:rgba(111,157,255,.12)}
.st.na{color:var(--neutral);background:rgba(138,160,191,.1)}

/* ---------- foods ---------- */
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search .in{padding-left:38px}
.ftable{width:100%;border-collapse:collapse;font-size:13.5px}
.ftable th{position:sticky;top:0;background:#172134;font-size:11.5px;color:var(--faint);font-weight:600;text-align:right;padding:9px 8px;white-space:nowrap;cursor:pointer;user-select:none;z-index:1}
.ftable th:first-child{text-align:left;padding-left:14px}
.ftable th[aria-sort]{color:var(--tx)}
.ftable td{padding:8px;border-top:1px solid #1c273a;text-align:right;white-space:nowrap}
.ftable td:first-child{text-align:left;padding-left:14px;white-space:normal;min-width:220px}
.ftable tbody tr{cursor:pointer}
.ftable tbody tr:hover td{background:#18233a}
.fscroll{max-height:calc(100vh - 250px);overflow:auto;border-radius:0 0 16px 16px}

/* ---------- profile ---------- */
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.outs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.out{padding:14px 16px;border-radius:13px;background:var(--ink2);border:1px solid var(--line)}
.out span{display:block;font-size:12.5px;color:var(--faint)}
.out b{display:block;font:600 24px/1.2 var(--f-disp);margin-top:4px}
.out em{font-style:normal;font-size:12px;color:var(--faint)}
.tgt{width:100%;border-collapse:collapse;font-size:14px}
.tgt td,.tgt th{padding:7px 8px;border-top:1px solid #1d293d;text-align:right}
.tgt th{border:0;font-size:11.5px;color:var(--faint);font-weight:600}
.tgt td:first-child,.tgt th:first-child{text-align:left}
.tgt .in{width:100px;padding:6px 8px;font-size:14px;text-align:right}
.tgt .calc{color:var(--faint);font-size:12.5px}

/* ---------- sheet (modal) ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,8,14,.62);backdrop-filter:blur(3px);z-index:80;display:none}
.scrim.on{display:block;animation:fadein .15s}
@keyframes fadein{from{opacity:0}}
.sheet{position:fixed;z-index:90;left:50%;top:6vh;transform:translateX(-50%);width:min(760px,94vw);max-height:88vh;
  display:none;flex-direction:column;background:linear-gradient(180deg,#18223a,#131c2d);border:1px solid var(--line2);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.sheet.on{display:flex;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}}
.sheet-h{display:flex;align-items:center;gap:12px;padding:16px 18px 12px}
.sheet-h h3{font-size:17px;font-weight:600}
.sheet-b{padding:0 18px 18px;overflow:auto;min-height:0}
.sheet-f{display:flex;gap:10px;justify-content:flex-end;padding:12px 18px 16px;border-top:1px solid var(--line)}
.results{margin-top:12px;display:grid;gap:4px}
.res{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;width:100%;padding:10px 12px;border-radius:11px;border:1px solid transparent;background:transparent}
.res:hover,.res.kb{background:#1f2c46;border-color:var(--line2)}
.res .n{font-weight:500}
.res .m{grid-column:1/-1;display:flex;gap:12px;font-size:12px;color:var(--faint)}
.res .k{font-weight:600;color:var(--kcal);font-size:13px}
.res .star{color:var(--warn)}
.grp{font-size:12px;color:var(--faint);font-weight:600;margin:12px 4px 4px}
.qty{display:grid;gap:14px}
.qty .chosen{padding:14px;border-radius:12px;background:var(--ink2);border:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line2);background:transparent;padding:7px 12px;border-radius:99px;font-weight:600;font-size:13px;color:var(--muted)}
.chips button:hover{border-color:var(--accent);color:var(--tx)}
.preview{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.preview div{padding:10px;border-radius:10px;background:var(--ink2);border:1px solid var(--line);text-align:center}
.preview small{display:block;font-size:11.5px;color:var(--faint)}
.preview b{font:600 17px var(--f-disp)}
.detail{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px 18px;font-size:13.5px}
.detail div{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #1f2b40}
.detail span{color:var(--muted)}
.editgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.editgrid .in{padding:8px 10px;font-size:14px}
textarea.in{min-height:160px;font:12.5px/1.45 ui-monospace,Consolas,monospace}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:120;
  background:#e9eff8;color:#0d1320;font-weight:600;font-size:14px;padding:11px 16px;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.45);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;display:flex;gap:12px;align-items:center}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:transparent;color:#0a7a57;font-weight:700;padding:0}

.bottom{display:none}
.about{display:flex;align-items:center;gap:16px}
.about .mark{width:54px;height:54px;flex-basis:54px}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .daygrid{grid-template-columns:minmax(0,1fr)}
  .summary{position:static;display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:center}
  .wk-top{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;
    padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
    background:rgba(15,22,35,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  .bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--faint);font-size:11px;font-weight:600;padding:6px 0;border-radius:10px}
  .bottom svg{width:21px;height:21px}
  .bottom button[aria-current="page"]{color:var(--accent);background:rgba(79,209,165,.08)}
  .content{padding-bottom:calc(var(--navh) + 30px + env(safe-area-inset-bottom,0px))}
  .top{padding-top:12px;padding-bottom:12px}
  .toast{bottom:calc(var(--navh) + 18px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:640px){
  html,body{overflow-x:hidden}
  .top{position:static}
  .summary{grid-template-columns:minmax(0,1fr)}
  .plate svg{width:190px;height:190px}
  .hide-s{display:none}
  .meal-h{flex-wrap:wrap;row-gap:6px}
  .meal-h .quota{margin-left:0;width:100%}
  /* ogni riga alimento diventa una scheda */
  .items thead{display:none}
  .items,.items tbody,.items tfoot{display:block}
  .items tr{display:grid;grid-template-columns:62px repeat(5,minmax(0,1fr)) 32px;align-items:end;column-gap:6px;padding:10px 12px 11px 14px;border-top:1px solid #1d293d}
  .items td{border:0;padding:0;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .items td:first-child{grid-column:1/7;grid-row:1;width:auto;padding:0 0 7px}
  .items td.act{grid-column:7;grid-row:1/span 2;align-self:center;width:auto;padding:0}
  .items td:nth-child(2){grid-column:1;grid-row:2;text-align:left}
  .items td.hide-s{display:block}
  .items td[data-l]::before{content:attr(data-l);display:block;font-size:10.5px;color:var(--faint);font-weight:600;margin-bottom:1px;white-space:nowrap}
  .items tfoot tr{background:rgba(255,255,255,.02)}
  .items tfoot td:nth-child(2){text-align:left}
  .gin{width:62px}
  .preview{grid-template-columns:repeat(3,1fr)}
  .sheet{top:auto;bottom:0;width:100vw;max-height:92vh;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  @keyframes pop{from{opacity:0;transform:translate(-50%,24px)}}
  .pbar{width:70px}
  .params .hide-s{display:none}
  .sheet-f{flex-wrap:wrap}
}

/* ---- stili aggiunti: preferiti, finestra condivisione, WhatsApp, indicatori ---- */
.fstar{width:12px;height:12px;color:var(--warn);vertical-align:-1px;margin-right:6px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--ink2)}
.opt:hover{border-color:#46618a}
.opt[aria-pressed="true"]{border-color:var(--accent);background:rgba(79,209,165,.07)}
.opt[disabled]{opacity:.45;pointer-events:none}
.opt b{display:block;font-weight:600}
.opt small{display:block;color:var(--faint);font-size:12.5px;margin-top:2px}
.opt .radio{flex:0 0 18px;width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);margin-top:2px}
.opt[aria-pressed="true"] .radio{border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--ink2);background:var(--accent)}
.btn.wa{background:#1faa59;border-color:transparent;color:#fff}
.btn.wa:hover{background:#25c266}
.btn.wa svg,.btn.pri svg{width:17px;height:17px}
.kd{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:9px;vertical-align:1px;background:var(--neutral)}
.kd.ok{background:var(--ok)} .kd.warn{background:var(--warn)} .kd.over{background:var(--over)} .kd.low{background:#8fb4ff} .kd.na{background:#3a4c68}
#p-foods .search{flex:1 1 340px}
.stack{grid-template-columns:minmax(0,1fr)}
.legend div{min-width:0}
@media (max-width:640px){
  .items tfoot td{border:0}
  .legend b{margin-left:auto}
  .donut svg{width:160px;height:160px}
  .wk-top .row{flex-direction:column;align-items:stretch}
  .wk-top .donut{align-self:center}
}

/* ---------- v1.1 ---------- */
.subnav{flex-basis:100%;display:flex;gap:4px;overflow-x:auto;margin:2px 0 -6px;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13.5px;padding:8px 13px;border-radius:9px 9px 0 0;white-space:nowrap;border-bottom:2px solid transparent}
.subnav button:hover{color:var(--tx)}
.subnav button[aria-current="true"]{color:#fff;border-bottom-color:var(--accent)}
.datebar{display:flex;align-items:center;gap:6px}
.datebar input{width:auto;padding:7px 10px;font-size:14px}
.note{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.tag.bad{background:var(--over);color:#fff}
.banner{padding:11px 14px;border-radius:11px;font-size:13.5px;line-height:1.45}
.banner.bad{background:rgba(255,100,100,.1);border:1px solid rgba(255,100,100,.35);color:#ffb3b3}
.banner.info{background:rgba(111,157,255,.08);border:1px solid rgba(111,157,255,.3);color:#c5d6ff}
.water{display:flex;align-items:center;gap:12px}
.water .cnt{font:700 26px/1 var(--f-disp)}
.water .glasses{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.water .glasses i{width:14px;height:20px;border-radius:3px 3px 5px 5px;border:1.5px solid #3b5a86;display:inline-block}
.water .glasses i.f{background:#56c7e8;border-color:#56c7e8}
.rem{display:grid;grid-template-columns:1fr auto;gap:7px 12px;font-size:13.5px}
.rem dt{color:var(--muted)} .rem dd{margin:0;text-align:right;font-weight:600}
.rem dd.neg{color:var(--over)}
.sug{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;text-align:left;width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--ink2);margin-bottom:6px}
.sug:hover{border-color:var(--accent)}
.sug small{grid-column:1/-1;color:var(--faint);font-size:12px}
.sug b{font-weight:500} .sug .fit{color:var(--accent);font-weight:700;font-size:13px;white-space:nowrap}
.check{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid #1d293d;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:0 0 20px}
.check.done .nm{text-decoration:line-through;color:var(--faint)}
.check .q{margin-left:auto;text-align:right;white-space:nowrap}
.check .q small{display:block;color:var(--faint);font-size:11.5px}
.chipsel{display:flex;gap:6px;flex-wrap:wrap}
.chipsel button{border:1px solid var(--line2);background:transparent;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chipsel button[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:#06140f}
details.panel>summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:12px}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary h2{font-size:16.5px;font-weight:600}
details.panel>summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
details.panel[open]>summary::after{transform:rotate(-135deg)}
details.panel>.inner{padding:0 18px 18px}
.scanbox{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3;max-height:52vh}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox::after{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;background:var(--over);box-shadow:0 0 12px var(--over)}
.syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-left:8px;vertical-align:1px}
.syncdot.err{background:var(--over)} .syncdot.busy{background:var(--warn)}
.mini{width:100%;height:auto;display:block}
.seg.mode button{font-size:12.5px;padding:6px 10px}

</style>

function migrate(o){

  const s = Object.assign(b, o);
  s.profile = Object.assign(blankState().profile, o.profile||{});
  s.ref = Object.assign(clone(FILE_DEFAULTS), o.ref||{});
  s.ref.v = Object.assign(clone(FILE_DEFAULTS.v), (o.ref&&o.ref.v)||{});
  s.ui = Object.assign(blankState().ui, o.ui||{});
  s.share = Object.assign({wa:''}, o.share||{});
  for(const k of ['diary','shopDone','baseOver']) if(!s[k] || typeof s[k]!=='object' || Array.isArray(s[k])) s[k] = {};
  for(const k of ['weights','avoid','weeks','reminders','favs','recents','custom','recipes']) if(!Array.isArray(s[k])) s[k] = [];
  if(!Array.isArray(s.shopDays)) s.shopDays = [0,1,2,3,4,5,6];
  if(!Array.isArray(s.cook) || !s.cook.length) s.cook = clone(COOK_DEFAULTS);
  if(!Array.isArray(s.measures) || !s.measures.length) s.measures = clone(MEASURE_DEFAULTS);
  if(!(s.glass>0)) s.glass = 200;
  { const seen = new Set(); for(const c of s.custom){ if(!c.id || seen.has(c.id)) c.id = uid('c'); seen.add(c.id); } }   // ripara eventuali identificativi doppi
  s.meta = Object.assign({updatedAt:0}, o.meta||{});

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ---- lingua: italiano (predefinito) o inglese ---- */
let LANG = 'it';
const loc = () => LANG==='en' ? 'en-GB' : 'it-IT';
let COLL = null, COLL_L = '';
const coll = () => { const l = loc(); if(COLL_L!==l){ COLL = new Intl.Collator(l); COLL_L = l; } return COLL; };   // molto più veloce di localeCompare(…, lingua)
const NF = {};
function fmt(v, d=0){
  if(v==null || !isFinite(v)) return '—';
  const key = LANG+d;
  const f = NF[key] || (NF[key] = new Intl.NumberFormat(loc(),{minimumFractionDigits:d, maximumFractionDigits:d}));
  const r = f.format(v);
  return /^-0([.,]0*)?$/.test(r) ? r.slice(1) : r;
}
/* numero per le caselle di input: senza separatore delle migliaia */
function fmtIn(v, d=0){
  if(v==null || !isFinite(v)) return '';
  return new Intl.NumberFormat(loc(),{useGrouping:false, maximumFractionDigits:d}).format(v);
}
const fmtN = (k,v)=>fmt(v, META[k] ? META[k].d : 1);
function num(x){
  if(x===''||x==null) return NaN;
  let s = String(x).replace(/\s/g,'');
  if(LANG==='en') s = s.replace(/,/g,'');
  else if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  const n = parseFloat(s);
  return isFinite(n) ? n : NaN;
}
let UIDN = 0;
const uid = p => p + Date.now().toString(36) + (UIDN++).toString(36) + Math.random().toString(36).slice(2,5);   // contatore: unici anche se creati nello stesso istante
function norm(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/['’`]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
}
function pretty(n){
  let s = n.toLowerCase().replace(/\s+/g,' ').trim();
  s = s.replace(/([aeiou])'(?=[\s,.;:)]|$)/g, (m,v)=>({a:'à',e:'è',i:'ì',o:'ò',u:'ù'})[v]);
  s = s.replace(/\b(uht|dop|igp|doc)\b/g, m=>m.toUpperCase());
  return s.charAt(0).toUpperCase() + s.slice(1);
}

/* ---- database alimenti: base (801 dal file) + personali + ricette ---- */
const DB = {list:[], byId:new Map(), byName:new Map()};
function recipeValues(r, seen){
  const tot = r.items.reduce((a,it)=>a+(+it.g||0),0);
  const v = new Array(NV).fill(0);
  if(tot<=0) return {v, tot:0};
  for(const it of r.items){
    const f = DB.byId.get(it.id);
    if(!f || (seen && seen.has(it.id))) continue;
    const g = +it.g||0;
    // foglio "Composizione Ricetta": (g)/100 = g*100/Tot ; valore = VLOOKUP * (g/100)/100
    for(let i=0;i<NV;i++) v[i] += f.v[i]*g/tot;
  }
  return {v, tot};
}
function buildDB(){
  DB.list = []; DB.byId.clear(); DB.byName.clear();
  RAW.forEach((r,idx)=>{
    const ov = S.baseOver && S.baseOver[r[0]];
    const it = pretty(r[0]), en = (typeof FOODS_EN!=='undefined' && FOODS_EN[idx]) || it;
    const f = {id:'b'+idx, name:r[0], disp: LANG==='en' ? en : it, dispIt:it, v:ov ? ov.slice(0,NV) : r.slice(1), kind:'base', over:!!ov};
    f.key = norm(it);                                            // chiave interna, sempre italiana
    if(LANG==='en') f.skey = norm(en + ' ' + it);                // in inglese si cerca con entrambi i nomi
    DB.list.push(f); DB.byId.set(f.id,f);
    if(!DB.byName.has(r[0])) DB.byName.set(r[0], f);
  });
  for(const c of S.custom){
    const f = {id:c.id, name:c.name, disp: LANG==='en' && c.en ? c.en : c.name, dispIt:c.name, v:c.v.slice(0,NV), kind:'custom', imp:!!c.imp};
    while(f.v.length<NV) f.v.push(0);
    f.key = norm(c.name);
    if(LANG==='en' && c.en) f.skey = norm(c.en + ' ' + c.name);   // alimenti personali con nome inglese (es. CSV bilingue)
    DB.list.push(f); DB.byId.set(f.id,f);
  }
  const rf = S.recipes.map(r=>{
    const f = {id:r.id, name:r.name, disp:r.name, v:new Array(NV).fill(0), kind:'recipe', tot:0};
    f.key = norm(f.disp);
    DB.list.push(f); DB.byId.set(f.id,f);
    return [r,f];
  });
  for(const [r,f] of rf){ const o = recipeValues(r, new Set([r.id])); f.v = o.v; f.tot = o.tot; }
  for(const f of DB.list) f.sk = norm(f.disp);
  const C = coll(); DB.list.sort((a,b)=>C.compare(a.sk, b.sk));
}
function searchFoods(q, limit=80, pool=DB.list){
  const toks = norm(q).split(' ').filter(Boolean);
  if(!toks.length) return [];
  const favs = new Set(S.favs), rec = new Set(S.recents);
  const out = [];
  for(const f of pool){
    const k = f.skey || f.key; let ok = true, sc = 0;
    for(const t of toks){
      const p = k.indexOf(t);
      if(p<0){ ok=false; break; }
      if(p===0) sc += 30; else if(k[p-1]===' ') sc += 14;
    }
    if(!ok) continue;
    if(k.startsWith(toks[0]+' ') || k===toks[0]) sc += 12;
    if(favs.has(f.id)) sc += 25;
    if(rec.has(f.id)) sc += 10;
    if(f.imp) sc -= 3;                      // alimenti importati da tabelle esterne: dopo la tabella del file
    else if(f.kind!=='base') sc += 6;       // ricette e alimenti creati da te: prima
    sc -= k.length*0.08;
    out.push([sc,f]);
  }
  out.sort((a,b)=>b[0]-a[0]);
  return out.slice(0,limit).map(x=>x[1]);
}

/* ---- calcoli ---- */
function zeros(){ return new Array(NV).fill(0); }
function itemVals(it){
  const f = DB.byId.get(it.id); const g = +it.g||0;
  if(!f) return zeros();
  return f.v.map(x=>x*g/100);   // =VLOOKUP(...)*g/100
}
function derive(t){
  const kP = t[I.proteine]*4, kL = t[I.lipidi]*9, kG = t[I.glucidi]*3.75;   // riga CALORIE
  const kcal = t[I.energia];
  const NaTot = t[I.Na] + t[I.Na2];                                        // W24 = SUM(W)+AF24
  return {
    kcal, kP, kL, kG,
    pP: kcal>0 ? kP*100/kcal : NaN, pL: kcal>0 ? kL*100/kcal : NaN, pG: kcal>0 ? kG*100/kcal : NaN,
    NaTot,
    kna: NaTot>0 ? t[I.K]/NaTot : NaN,                                       // J28 = K/Na
    pral: 0.49*t[I.proteine] + 0.037*t[I.P] - 0.021*t[I.K] - 0.013*t[I.Ca] - 0.026*t[I.Mg] - 0.021*t[I.Na2]  // K28
  };
}
function dayTotals(d){ return totalsOf(S.menus[d]); }
function diaryEntry(k, create){
  if(!S.diary[k] && create) S.diary[k] = {meals:{colazione:[],pranzo:[],spuntini:[],cena:[]}, water:0, t:0};
  return S.diary[k] || null;
}
function entryUsed(e){ return !!e && (e.water>0 || MEALS.some(M=>(e.meals[M.k]||[]).length)); }
function diaryTotals(k){
  const e = S.diary[k];
  const T = totalsOf(e ? e.meals : {colazione:[],pranzo:[],spuntini:[],cena:[]});
  T.water = e ? (+e.water||0) : 0;
  T.foodWater = T.t[I.acqua];
  T.t[I.acqua] += T.water;                     // acqua dei cibi + acqua bevuta (ml ≈ g)
  T.used = entryUsed(e);
  T.x = derive(T.t);
  return T;
}
function totalsOf(m){
  const t = zeros(); const meal = {}; let n = 0;
  for(const M of MEALS){
    const mt = zeros();
    for(const it of (m[M.k]||[])){ const v = itemVals(it); for(let i=0;i<NV;i++){ mt[i]+=v[i]; t[i]+=v[i]; } n++; }
    meal[M.k] = mt;
  }
  return {t, meal, n, x:derive(t)};
}
function weekAverages(mode){
  const days = Array.from({length:DAYS},(_,d)=>dayTotals(d));
  const used = mode==='excel' ? days : days.filter(x=>x.n>0);
  if(!used.length || !days.some(x=>x.n>0)) return {days, used:0, a:null, x:null};
  const a = zeros();
  for(const d of used) for(let i=0;i<NV;i++) a[i] += d.t[i];
  for(let i=0;i<NV;i++) a[i] /= used.length;
  return {days, used:used.length, a, x:derive(a)};
}
function profileCalc(){
  const p = S.profile, R = S.ref;
  const eta = num(p.eta), h = num(p.altezza), w = num(p.peso);
  let bmr = NaN;
  if(isFinite(eta) && isFinite(h) && isFinite(w)){
    if(p.sesso==='M') bmr = 66.473 + 13.7156*w + 5.033*h - 6.775*eta;          // Harris-Benedict (D13)
    else if(p.sesso==='F') bmr = 655.095 + 9.5634*w + 1.849*h - 4.6756*eta;
  }
  const dose = R.attivita[p.attivita];
  const kcalMax = (isFinite(bmr) && bmr!==0 && dose!=null) ? dose + bmr : NaN;  // E11
  const fr = R.regime[p.regime];
  const protMax = (isFinite(w) && fr!=null) ? w*fr : NaN;                      // AI6 = peso * fattore
  const bmi = (isFinite(w) && isFinite(h) && h>0) ? 1.3*w/Math.pow(h/100,2.5) : NaN;  // H29
  const bmiClassic = (isFinite(w) && isFinite(h) && h>0) ? w/Math.pow(h/100,2) : NaN;
  return {bmr, dose, kcalMax, kcalIdeal: kcalMax*R.energiaIdealePct/100, protMax, bmi, bmiClassic};
}

function resolveMax(m, avg){
  if(typeof m==='string' && m.startsWith('edi:')) return avg ? avg[I.edibile]*parseFloat(m.slice(4))/100 : NaN;
  return m;
}
function status(kind, v, i, m){
  if(v==null || !isFinite(v)) return ['na','Nessun dato'];
  const hasI = i!=null && isFinite(i), hasM = m!=null && isFinite(m);
  switch(kind){
    case 'limit':
      if(hasM && v>m) return ['over','Oltre il max'];
      if(hasI && v>i && !(hasM && i===m)) return ['warn','Sopra l’ideale'];
      if(!hasI && !hasM) return ['na','Senza riferimento'];
      return ['ok','Nei limiti'];
    case 'target':
      if(hasM && v>m) return ['over','Oltre il max'];
      if(hasI && v<i) return ['low','Sotto l’ideale'];
      if(!hasI) return ['na','Senza riferimento'];
      return ['ok','Raggiunto'];
    case 'range':
      if(!hasI && !hasM) return ['na','Completa il profilo'];
      if(hasM && v>m) return ['over','Oltre il max'];
      if(hasI && v<i) return ['low','Sotto l’ideale'];
      return ['ok','In fascia'];
    case 'maxonly':
      if(hasM && v>m) return ['over','Oltre il max'];
      return ['ok','Nei limiti'];
    case 'neg': return v<=0 ? ['ok','Alcalinizzante'] : ['warn','Acidificante'];
    case 'ref': return ['na','Riferimento'];
    default: return ['na','—'];
  }
}

function curMeals(){ return S.ui.page==='today' ? diaryEntry(selDate(), true).meals : S.menus[S.ui.day]; }
function touchCur(){ if(S.ui.page==='today'){ const e = diaryEntry(selDate(), true); e.t = Date.now(); } }

/* ---------------- PASTI (menù e diario) ---------------- */
function menuCols(){
  return S.ui.view==='macro'
    ? [['proteine','Prot. g','c-prot',1],['lipidi','Lip. g','c-lip',1],['glucidi','Gluc. g','c-glu',1],['fibra','Fibra g','c-fib',1],['energia','kcal','c-kcal',0]]
    : [['Na','Na mg','c-min',0],['K','K mg','c-min',0],['P','P mg','c-min',0],['Ca','Ca mg','c-min',0],['energia','kcal','c-kcal',0]];
}
function foodTags(f, id){
  let t = !f ? '<span class="tag bad">mancante</span>' : f.kind==='recipe' ? '<span class="tag">Ricetta</span>' : f.kind==='custom' ? '<span class="tag cst">Personale</span>' : '';
  if(S.avoid.includes(id)) t += '<span class="tag bad">Da evitare</span>';
  return t;
}
function itemNote(it){
  if(it.cw) return `<span class="note">Pesato cotto: ${fmt(it.cw)} g</span>`;
  if(it.mq) return `<span class="note">${fmt(it.mn, it.mn%1?1:0)} × ${esc(it.mq)}</span>`;
  return '';
}
function mealsHTML(meals, T, P){
  const cols = menuCols();
  let h = '';
  for(const M of MEALS){
    const items = (meals && meals[M.k]) || [], mt = T.meal[M.k], q = S.ref.quote[M.k];
    let quota = '';
    if(isFinite(P.kcalMax)){
      const target = P.kcalMax*q/100, pct = target>0 ? mt[I.energia]/target*100 : 0;
      quota = `<span class="num">${fmt(mt[I.energia])} / ${fmt(target)} kcal</span><span class="gauge" title="${q}% del fabbisogno"><i style="width:${Math.min(pct,100)}%;background:${pct>100?'var(--over)':'var(--kcal)'}"></i></span>`;
      if(isFinite(P.protMax)) quota += `<span class="num hide-s">Prot. ${fmt(mt[I.proteine],1)} / ${fmt(P.protMax*q/100,1)} g</span>`;
    } else if(items.length){
      quota = `<span class="num">${fmt(mt[I.energia])} kcal</span>`;
    }
    h += `<div class="panel meal"><div class="meal-h"><h3>${M.l}</h3><span class="faint small">${q}%</span><div class="quota">${quota}</div></div>`;
    if(items.length){
      h += `<div class="tblwrap"><table class="items"><thead><tr><th>Alimento</th><th>g</th>${cols.map((c,ci)=>`<th class="${c[2]} ${ci===3?'hide-s':''}">${c[1]}</th>`).join('')}<th></th></tr></thead><tbody>`;
      items.forEach((it,ix)=>{
        const f = DB.byId.get(it.id), v = itemVals(it);
        h += `<tr><td><span class="nm">${esc(f?f.disp:'Alimento eliminato')}</span>${foodTags(f,it.id)}${itemNote(it)}</td>
          <td><input class="in gin num" inputmode="decimal" value="${fmtIn(it.g, it.g%1?1:0)}" data-g="${M.k}:${ix}" aria-label="Grammi"></td>
          ${cols.map((c,ci)=>`<td class="${ci===3?'hide-s':''}" data-l="${c[1]}">${fmt(colVal(v,c[0]),c[3])}</td>`).join('')}
          <td class="act"><button class="iconbtn del" data-del="${M.k}:${ix}" aria-label="Rimuovi">${svgI('i-trash')}</button></td></tr>`;
      });
      const g = items.reduce((a,x)=>a+(+x.g||0),0);
      h += `</tbody><tfoot><tr><td>Totale ${M.l.toLowerCase()}</td><td data-l="g">${fmt(g)}</td>${cols.map((c,ci)=>`<td class="${c[2]} ${ci===3?'hide-s':''}" data-l="${c[1]}">${fmt(colVal(mt,c[0]),c[3])}</td>`).join('')}<td class="act"></td></tr></tfoot></table></div>`;
    } else {
      h += `<div class="empty">Nessun alimento a ${M.l.toLowerCase()}.</div>`;
    }
    h += `<div class="add-row"><button class="btn sm" data-add="${M.k}">${svgI('i-plus')}Aggiungi alimento</button></div></div>`;
  }
  return h;
}

function plateSVG(kcal, mk, max, ideal){
  const R = 86, C = 2*Math.PI*R, sum = mk[0]+mk[1]+mk[2];
  const frac = isFinite(max)&&max>0 ? Math.min(kcal/max,1) : (kcal>0?1:0);
  const colors = ['var(--prot)','var(--lip)','var(--glu)'];
  let off = 0, segs = '';
  if(sum>0 && frac>0){
    const total = frac*C, n = mk.filter(x=>x>0).length, gap = n>1 && frac>0.08 ? 3 : 0;
    mk.forEach((x,i)=>{
      if(x<=0) return;
      const len = Math.max(total*x/sum - gap, 0.5);
      segs += `<circle cx="110" cy="110" r="${R}" fill="none" stroke="${colors[i]}" stroke-width="18" stroke-linecap="butt" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 110 110)"/>`;
      off += total*x/sum;
    });
  }
  let marks = '';
  if(isFinite(max) && max>0){
    const tick = (p,col)=>{ const a = (-90+p*360)*Math.PI/180, r1=74, r2=100; return `<line x1="${110+r1*Math.cos(a)}" y1="${110+r1*Math.sin(a)}" x2="${110+r2*Math.cos(a)}" y2="${110+r2*Math.sin(a)}" stroke="${col}" stroke-width="2" stroke-linecap="round"/>`; };
    if(isFinite(ideal)) marks += tick(ideal/max,'#dce6f5');
    if(kcal>max){
      const o = Math.min((kcal-max)/max,1)*2*Math.PI*104;
      marks += `<circle cx="110" cy="110" r="104" fill="none" stroke="var(--over)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${o.toFixed(2)} 999" transform="rotate(-90 110 110)"/>`;
    }
  }
  const sub = isFinite(max) ? 'su '+fmt(max)+' kcal' : 'kcal del giorno';
  const pct = isFinite(max)&&max>0&&kcal>0 ? fmt(kcal/max*100)+'% del fabbisogno' : '';
  return `<svg viewBox="0 0 220 220" role="img" aria-label="Energia ${fmt(kcal)} kcal">
    <circle cx="110" cy="110" r="${R}" fill="none" stroke="#0d1522" stroke-width="18"/>
    <circle cx="110" cy="110" r="${R-13}" fill="none" stroke="#1d2940" stroke-width="1"/>
    ${segs}${marks}
    <text x="110" y="110" text-anchor="middle" class="big">${fmt(kcal)}</text>
    <text x="110" y="134" text-anchor="middle" class="lbl">${sub}</text>
    <text x="110" y="152" text-anchor="middle" class="lbl" style="fill:${kcal>max?'var(--over)':'var(--faint)'}">${pct}</text>
  </svg>`;
}
function daySummary(T, P){
  const t = T.t, x = T.x, V = S.ref.v;
  const mrow = (lab,cls,val,ref,pc,kind) => {
    const w = isFinite(ref)&&ref>0 ? Math.min(val/ref*100,100) : 0, over = isFinite(ref)&&val>ref;
    const col = !over || kind==='target' ? `var(--${cls})` : kind==='max' ? 'var(--over)' : 'var(--warn)';
    const tip = !isFinite(ref) ? '' : kind==='max' ? `Max ${fmt(ref,1)} g` : `Ideale ${fmt(ref,1)} g`;
    return `<div class="mrow" title="${tip}"><span><span class="sw" style="background:var(--${cls})"></span>${lab}</span>
      <span class="bar"><i style="width:${w}%;background:${col}"></i></span>
      <span class="v"><b style="${over&&kind!=='target'?'color:'+col:''}">${fmt(val,1)}</b> g${pc!=null?` <span class="faint">${isFinite(pc)?fmt(pc)+'%':''}</span>`:''}</span></div>`;
  };
  const used = T.n>0 || T.water>0;
  const kvs = [['Na','Sodio',x.NaTot,V.Na,'limit'],['K','Potassio',t[I.K],V.K,'limit'],['P','Fosforo',t[I.P],V.P,'limit'],['Ca','Calcio',t[I.Ca],V.Ca,'target'],['acqua','Acqua',t[I.acqua],V.acqua,'target']];
  const dot = st => `<span class="kd ${st[0]}" title="${st[1]}"></span>`;
  let kv = kvs.map(([k,l,v,r,kind])=>{ const st = used ? status(kind,v,r.i,r.m) : ['na','']; return `<dt>${dot(st)}${l}</dt><dd class="num">${fmt(v)} <span class="faint small">${META[k].u}</span></dd>`; }).join('');
  kv += `<dt>${dot(T.n?status('ref',x.kna):['na',''])}Rapporto K/Na</dt><dd class="num">${fmt(x.kna,2)}</dd>`;
  kv += `<dt>${dot(T.n?status('neg',x.pral):['na',''])}PRAL</dt><dd class="num">${T.n?fmt(x.pral,1):'—'} <span class="faint small">mEq</span></dd>`;
  return `<div class="plate">${plateSVG(x.kcal,[x.kP,x.kL,x.kG],P.kcalMax,P.kcalIdeal)}</div>
    <div>
      <div class="macros">
        ${mrow('Proteine','prot',t[I.proteine],P.protMax,x.pP,'max')}
        ${mrow('Lipidi','lip',t[I.lipidi],V.lipidi.i,x.pL,'limit')}
        ${mrow('Glucidi','glu',t[I.glucidi],V.glucidi.i,x.pG,'limit')}
        ${mrow('Fibra','fib',t[I.fibra],V.fibra.i,null,'target')}
      </div>
      <div class="head" style="margin:18px 0 10px"><h2 style="font-size:14px">Minerali e indici</h2><span class="rule"></span></div>
      <dl class="kv">${kv}</dl>
      <button class="btn sm" style="margin-top:14px;width:100%" data-act="daydetail">Tutti i valori del giorno</button>
    </div>`;
}

/* ---------------- PAGINA SETTIMANA ---------------- */
function renderWeek(){
  const W = weekAverages(S.ui.avg), P = profileCalc();
  const filled = W.days.filter(d=>d.n>0).length;
  setTop('Riepilogo settimanale', filled ? `${filled} giorni compilati su 7` : 'Nessun giorno compilato',
    `<div class="seg" role="group" aria-label="Calcolo della media"><button data-avg="filled" aria-pressed="${S.ui.avg==='filled'}">Media sui giorni compilati</button><button data-avg="excel" aria-pressed="${S.ui.avg==='excel'}">Su 7 giorni, come nel file</button></div>
     <button class="btn pri" data-act="share" ${filled?'':'disabled'}>${SHARE_ICON}Condividi PDF</button>`);
  if(!W.a){
    $('#wk-donut').innerHTML = `<div class="head"><h2>Ripartizione energetica</h2><span class="rule"></span></div><p class="help">Compila almeno un giorno del menù per vedere medie, ripartizione e confronto con i valori ideali.</p><button class="btn pri" data-sub="days">Vai ai giorni</button>`;
    $('#wk-chart').innerHTML = weekChart(W, P);
    $('#wk-params').innerHTML = '';
    return;
  }
  const x = W.x, a = W.a;
  const segs = [[x.pP,'prot','Proteine',a[I.proteine]],[x.pL,'lip','Lipidi',a[I.lipidi]],[x.pG,'glu','Glucidi',a[I.glucidi]]];
  const tot = segs.reduce((s,z)=>s+(isFinite(z[0])?z[0]:0),0);
  const R = 70, C = 2*Math.PI*R; let off = 0, arcs = '';
  for(const [p,c] of segs){ if(!(p>0)) continue; const len = C*p/Math.max(tot,100); arcs += `<circle cx="95" cy="95" r="${R}" fill="none" stroke="var(--${c})" stroke-width="22" stroke-dasharray="${Math.max(len-2,0.5).toFixed(2)} ${C}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 95 95)"/>`; off += len; }
  $('#wk-donut').innerHTML = `<div class="head"><h2>Ripartizione energetica</h2><span class="rule"></span></div>
    <div class="row" style="gap:20px;align-items:center">
      <div class="donut"><svg viewBox="0 0 190 190" role="img" aria-label="Ripartizione energetica media"><circle cx="95" cy="95" r="${R}" fill="none" stroke="#0d1522" stroke-width="22"/>${arcs}
        <text x="95" y="96" text-anchor="middle" style="font:700 26px var(--f-disp);fill:var(--tx)">${fmt(x.kcal)}</text><text x="95" y="116" text-anchor="middle" style="font:500 12px var(--f-ui);fill:var(--faint)">kcal medie</text></svg></div>
      <div class="legend grow" style="min-width:150px">
        ${segs.map(([p,c,l,g])=>`<div><span class="sw" style="background:var(--${c})"></span>${l}<b class="num">${fmt(p,1)}%</b></div><div class="faint small" style="margin:-6px 0 2px 15px">${fmt(g,1)} g al giorno</div>`).join('')}
        <div class="faint small" style="border-top:1px solid var(--line);padding-top:8px">Somma: ${fmt(tot,1)}% (proteine ×4, lipidi ×9, glucidi ×3,75 su energia da tabella)</div>
      </div>
    </div>`;
  $('#wk-chart').innerHTML = weekChart(W, P);
  $('#wk-params').innerHTML = paramsTable(a, x);
}
function weekChart(W, P){
  const vals = W.days.map(d=>d.x.kcal), mx = Math.max(...vals, isFinite(P.kcalMax)?P.kcalMax:0, 500)*1.12;
  const w = 640, h = 250, L = 46, B = 34, T = 16, RR = w-62, cw = (RR-L)/7, sy = v => T + (h-T-B)*(1 - v/mx);
  let g = '';
  const step = mx>3000 ? 1000 : 500;
  for(let v=0; v<=mx; v+=step) g += `<line x1="${L}" x2="${RR}" y1="${sy(v)}" y2="${sy(v)}" stroke="#1f2b40"/><text x="${L-8}" y="${sy(v)+4}" text-anchor="end" style="font:500 11px var(--f-ui);fill:var(--faint)">${fmt(v)}</text>`;
  W.days.forEach((d,i)=>{
    const x0 = L + i*cw + cw*0.2, bw = cw*0.6;
    if(d.n===0){
      g += `<rect x="${x0}" y="${sy(mx*0.12)}" width="${bw}" height="${sy(0)-sy(mx*0.12)}" rx="6" fill="none" stroke="#2c3d58" stroke-dasharray="4 4"/>`;
    } else {
      const mk = [d.x.kP,d.x.kL,d.x.kG], s = mk[0]+mk[1]+mk[2] || 1; let y = sy(0);
      ['prot','lip','glu'].forEach((c,j)=>{ const hh = (sy(0)-sy(d.x.kcal))*mk[j]/s; y -= hh; g += `<rect x="${x0}" y="${y}" width="${bw}" height="${Math.max(hh,0)}" fill="var(--${c})"${j===2?' rx="0"':''}/>`; });
      g += `<text x="${x0+bw/2}" y="${sy(d.x.kcal)-6}" text-anchor="middle" style="font:600 11px var(--f-ui);fill:${isFinite(P.kcalMax)&&d.x.kcal>P.kcalMax?'var(--over)':'var(--muted)'}">${fmt(d.x.kcal)}</text>`;
    }
    g += `<text x="${x0+bw/2}" y="${h-12}" text-anchor="middle" style="font:600 12px var(--f-ui);fill:${i===S.ui.day?'var(--accent)':'var(--muted)'}">${DAY_SHORT[i]}</text>`;
    g += `<rect x="${L+i*cw}" y="${T}" width="${cw}" height="${h-T}" fill="transparent" data-day-go="${i}" style="cursor:pointer"><title>${DAY_NAMES[i]}</title></rect>`;
  });
  if(isFinite(P.kcalMax)){
    const lab = (v,col,t1,dy)=>`<text x="${RR+8}" y="${sy(v)+dy}" style="font:700 10.5px var(--f-ui);fill:${col}">${t1}</text><text x="${RR+8}" y="${sy(v)+dy+13}" style="font:500 10.5px var(--f-ui);fill:${col}">${fmt(v)}</text>`;
    const close = Math.abs(sy(P.kcalMax)-sy(P.kcalIdeal)) < 28;
    g += `<line x1="${L}" x2="${RR}" y1="${sy(P.kcalMax)}" y2="${sy(P.kcalMax)}" stroke="var(--over)" stroke-dasharray="6 5" stroke-width="1.5"/>` + lab(P.kcalMax,'var(--over)','Max',close?-14:-2);
    g += `<line x1="${L}" x2="${RR}" y1="${sy(P.kcalIdeal)}" y2="${sy(P.kcalIdeal)}" stroke="var(--ok)" stroke-dasharray="6 5" stroke-width="1.5"/>` + lab(P.kcalIdeal,'var(--ok)','Ideale',close?10:-2);
  }
  return `<div class="head"><h2>Energia per giorno</h2><span class="rule"></span><span class="faint small"><span class="sw" style="background:var(--prot)"></span>Prot. <span class="sw" style="background:var(--lip);margin-left:8px"></span>Lip. <span class="sw" style="background:var(--glu);margin-left:8px"></span>Gluc.</span></div>
    <svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Calorie per giorno">${g}</svg>`;
}
function paramsTable(a, x){
  let h = `<div class="tblwrap"><table class="params"><thead><tr><th style="padding-left:18px">Parametro</th><th>Media</th><th>Ideale</th><th>Max</th><th class="hide-s"></th><th style="padding-right:18px">Stato</th></tr></thead>`;
  for(const grp of paramSpec()){
    h += `<tbody><tr><td colspan="6" style="padding:16px 18px 6px;border:0"><b class="disp" style="font-size:14px">${grp.g}</b></td></tr>`;
    for(const r of grp.rows){
      const meta = META[r.k] || {l:r.l, u:r.u, d:r.d};
      const v = r.k==='Na' ? x.NaTot : r.k==='kna' ? x.kna : r.k==='pral' ? x.pral : a[I[r.k]];
      const m = resolveMax(r.m, a), i = r.i;
      const st = status(r.kind, v, i, m);
      const ref = isFinite(m)&&m>0 ? m : (isFinite(i)&&i>0 ? i : NaN);
      const w = isFinite(ref) && v>0 ? Math.min(v/ref*100,100) : 0;
      const tick = isFinite(i)&&isFinite(m)&&m>0&&i<m ? `<u style="left:${i/m*100}%"></u>` : '';
      const col = {ok:'var(--ok)',warn:'var(--warn)',over:'var(--over)',low:'#8fb4ff',na:'var(--neutral)'}[st[0]];
      const dd = meta.d??1, iTxt = r.kind==='neg' ? '< 0' : (i!=null&&isFinite(i) ? fmt(i, Math.abs(i)<10 && Math.abs(i-Math.round(i*10**dd)/10**dd)>1e-9 ? Math.min(dd+2,3) : dd) : '—');
      h += `<tr${r.note?` title="${esc(r.note)}"`:''}><td style="padding-left:18px">${esc(meta.l)}<span class="unit">${meta.u||''}</span></td>
        <td class="num"><b>${fmt(v, meta.d??1)}</b></td><td class="num muted">${iTxt}</td><td class="num muted">${isFinite(m)?fmt(m, meta.d??1):'—'}</td>
        <td class="hide-s">${isFinite(ref)&&r.kind!=='neg'?`<span class="pbar"><i style="width:${w}%;background:${col}"></i>${tick}</span>`:''}</td>
        <td style="padding-right:18px"><span class="st ${st[0]}">${st[1]}</span></td></tr>`;
    }
    h += `</tbody>`;
  }
  return h + `</table></div><p class="help" style="padding:4px 18px 18px">Valori di riferimento dal tuo file, modificabili in Profilo. Il sodio comprende quello del bicarbonato. Il PRAL usa la formula del file.</p>`;
}

      <button class="btn sm" data-editrecipe="${r.id}">${svgI('i-edit')}Modifica</button><button class="iconbtn del" data-delrecipe="${r.id}" aria-label="Elimina ricetta">${svgI('i-trash')}</button></div>
      <div class="preview" style="margin-top:12px">${pv('kcal','energia',v)}${pv('Proteine','proteine',v)}${pv('Lipidi','lipidi',v)}${pv('Glucidi','glucidi',v)}${pv('Fibra','fibra',v)}</div>
      <div class="faint small" style="margin-top:8px">Valori per 100 g. ${r.items.map(it=>{const g=DB.byId.get(it.id);return esc(g?g.disp:'?')+' '+fmt(it.g)+' g';}).join(', ')}</div></div>`;
  }).join('');
}
const pv = (lab,k,v)=>`<div><small>${lab}</small><b class="num c-${{energia:'kcal',proteine:'prot',lipidi:'lip',glucidi:'glu',fibra:'fib'}[k]}">${fmtN(k,v[I[k]])}</b></div>`;
function recipeEditor(){
  const o = recipeValues(draft), v = o.v;
  let rows = draft.items.map((it,ix)=>{

const FCOLS = {
  macro:['energia','proteine','lipidi','glucidi','fibra','edibile'],
  min:['Na','K','P','Ca','Fe','Mg','Zn'],
  vit:['vitC','vitB6','folati','vitD','niacina'],
  rap:['energia','proteine','rP','rK','rPh','rNa','rPP'],
};
const FHEAD = {rP:'Prot. g/100 kcal', rK:'K mg/100 kcal', rPh:'P mg/100 kcal', rNa:'Na mg/100 kcal', rPP:'P/prot. mg/g'};
let fsort = {k:'name', dir:1}, fq = '', ftRows = [], ftShown = 0, ftObs = null;
const FT_STEP = 80;
function renderFoods(){
  const kinds = [['all','Tutti'],['fav','Preferiti'],['custom','Personali'],['recipe','Ricette']];
  $('#f-cols').innerHTML = [['macro','Macro'],['min','Minerali'],['vit','Vitamine'],['rap','Rapporti']].map(([k,l])=>`<button data-fcols="${k}" aria-pressed="${S.ui.fcols===k}">${l}</button>`).join('');
  $('#f-kind').innerHTML = kinds.map(([k,l])=>`<button data-fkind="${k}" aria-pressed="${S.ui.fkind===k}">${l}</button>`).join('');
  let pool = DB.list;
  if(S.ui.fkind==='fav'){ const fs = new Set(S.favs); pool = pool.filter(f=>fs.has(f.id)); }
  else if(S.ui.fkind!=='all') pool = pool.filter(f=>f.kind===S.ui.fkind);
  let list = fq.trim() ? searchFoods(fq, 2000, pool) : pool.slice();
  const cols = FCOLS[S.ui.fcols];
  if(fsort.k!=='name' || !fq.trim()){
    const sv = (f)=>{ const x = colVal(f.v,fsort.k); return isFinite(x) ? x : null; }, C = coll();
    list.sort((a,b)=>{
      if(fsort.k==='name') return C.compare(a.sk, b.sk)*fsort.dir;
      const A = sv(a), B = sv(b);
      if(A===null && B===null) return 0; if(A===null) return 1; if(B===null) return -1;   // valori mancanti in fondo
      return (A-B)*fsort.dir;
    });
  }
  setTop('Tabella alimenti', `${list.length} di ${DB.list.length} alimenti, valori per 100 g`, '');
  const favs = new Set(S.favs);
  const th = (k,l)=>`<th data-sort="${k}" ${fsort.k===k?`aria-sort="${fsort.dir>0?'ascending':'descending'}"`:''}>${l}${fsort.k===k?(fsort.dir>0?' ▲':' ▼'):''}</th>`;
  let h = `<table class="ftable"><thead><tr>${th('name','Alimento')}${cols.map(k=>th(k, FHEAD[k] || (META[k].l.replace('Glucidi disponibili','Glucidi')+' '+(k==='edibile'?'%':META[k].u)))).join('')}</tr></thead><tbody>`;
  ftRows = list; ftShown = 0;
  h += `</tbody></table><div id="f-more" class="faint small" style="padding:14px 18px;text-align:center"></div>`;
  if(!list.length) h = `<div class="empty" style="padding:24px 18px">Nessun alimento trovato. Prova con meno parole, oppure crea un nuovo alimento.</div>`;
  $('#f-wrap').innerHTML = h;
  if(list.length) moreFoodRows();
}
/* le righe della tabella vengono aggiunte a blocchi mentre si scorre: con migliaia di alimenti la pagina resta veloce */
function moreFoodRows(){
  const tb = document.querySelector('#f-wrap tbody'); if(!tb) return;
  const cols = FCOLS[S.ui.fcols], favs = new Set(S.favs);
  const part = ftRows.slice(ftShown, ftShown + (ftShown ? FT_STEP*2 : FT_STEP));
  tb.insertAdjacentHTML('beforeend', part.map(f=>`<tr data-food="${f.id}"><td>${favs.has(f.id)?'<svg class="fstar"><use href="#i-star"/></svg>':''}<span class="nm">${esc(f.disp)}</span>${foodTags(f, f.id)}</td>${cols.map(k=>`<td class="num">${fmtN(k,colVal(f.v,k))}</td>`).join('')}</tr>`).join(''));
  ftShown += part.length;
  const more = $('#f-more'); if(!more) return;
  if(ftShown >= ftRows.length){ more.textContent = ''; if(ftObs) ftObs.disconnect(); return; }
  more.innerHTML = `<button class="btn sm" data-fmore>Mostra altri (${ftRows.length - ftShown})</button>`;
  if('IntersectionObserver' in window){
    if(ftObs) ftObs.disconnect();
    ftObs = new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting)) moreFoodRows(); }, {rootMargin:'600px'});
    ftObs.observe(more);
  }
}
document.addEventListener('click', e=>{ if(e.target.closest('[data-fmore]')) moreFoodRows(); });

/* ================= FINESTRE, SCELTA ALIMENTI, AZIONI ================= */
let sheetOnClose = null;
function openSheet(title, body, foot, onClose){
  if(sheetOnClose){ const f = sheetOnClose; sheetOnClose = null; try{ f(); }catch(e){} }
  $('#sheet-title').className = '';
  $('#sheet-title').textContent = title;
  $('#sheet-b').innerHTML = body || '';
  $('#sheet-f').innerHTML = foot || '';
  $('#sheet-f').style.display = foot ? '' : 'none';
  $('#scrim').classList.add('on'); $('#sheet').classList.add('on');
  sheetOnClose = onClose || null;
}
function closeSheet(){
  if(!$('#sheet').classList.contains('on')) return false;
  $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on');
  const f = sheetOnClose; sheetOnClose = null; pick = null; f && f();
  return true;
}
function confirmSheet(title, text, okLabel, onOk, danger){
  openSheet(title, `<p class="help" style="font-size:14.5px;color:var(--muted)">${text}</p>`,
    `<button class="btn quiet" data-act="close">Annulla</button><button class="btn ${danger?'bad':'pri'}" id="cf-ok">${okLabel}</button>`);
  $('#cf-ok').onclick = ()=>{ closeSheet(); onOk(); };
}
let toastT = null;
function toast(msg, undo){
  $('#toast-t').textContent = msg;
  const u = $('#toast-u'); u.hidden = !undo;
  u.onclick = ()=>{ undo && undo(); $('#toast').classList.remove('on'); };
  $('#toast').classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(()=>$('#toast').classList.remove('on'), undo ? 5200 : 2600);
}

/* ---- scelta alimento (ricerca + quantità) ---- */
let pick = null;
function openPicker(opts){
  pick = Object.assign({step:'search', q:'', kb:0, list:[]}, opts);
  openSheet(pick.title, '', '');
  pickerSearch();
}
function pickerPool(){ return pick.noRecipes ? DB.list.filter(f=>f.kind!=='recipe') : DB.list; }
function pickerSearch(){
  pick.step = 'search';
  $('#sheet-f').style.display = 'none';
  $('#sheet-b').innerHTML = `<div class="search"><svg><use href="#i-search"/></svg><input class="in" id="pk-q" type="search" autocomplete="off" placeholder="Scrivi il nome, es. pasta integrale" value="${esc(pick.q)}"></div><div class="results" id="pk-res"></div>`;
  pickerResults();
  const q = $('#pk-q'); setTimeout(()=>q.focus(), 30);
  q.oninput = ()=>{ if(!pick) return; pick.q = q.value; pick.kb = 0; pickerResults(); };
  q.onkeydown = e=>{
    if(!pick) return;
    if(e.key==='ArrowDown'){ pick.kb = Math.min(pick.kb+1, pick.list.length-1); pickerResults(true); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ pick.kb = Math.max(pick.kb-1, 0); pickerResults(true); e.preventDefault(); }
    else if(e.key==='Enter' && pick.list[pick.kb]){ pickChoose(pick.list[pick.kb].id); e.preventDefault(); }
  };
}
function resHTML(f, ix){
  const v = f.v, fav = S.favs.includes(f.id);
  const tag = ' '+foodTags(f, f.id);
  return `<button class="res ${ix===pick.kb?'kb':''}" data-pk="${f.id}"><span class="n">${fav?`<svg class="fstar"><use href="#i-star"/></svg>`:''}<span class="nm">${esc(f.disp)}</span>${tag}</span><span class="k num">${fmt(v[I.energia])} kcal</span>
    <span class="m num"><span class="c-prot">P ${fmt(v[I.proteine],1)}</span><span class="c-lip">L ${fmt(v[I.lipidi],1)}</span><span class="c-glu">G ${fmt(v[I.glucidi],1)}</span><span>Na ${fmt(v[I.Na]+v[I.Na2])}</span><span>K ${fmt(v[I.K])}</span><span>per 100 g</span></span></button>`;
}
function pickerResults(onlyKb){
  const box = $('#pk-res'); if(!box) return;
  const pool = pickerPool();
  let h = '';
  if(pick.q.trim()){
    pick.list = searchFoods(pick.q, 60, pool);
    h = pick.list.length ? pick.list.map((f,i)=>resHTML(f,i)).join('') : `<div class="empty">Nessun risultato per "${esc(pick.q)}". Puoi crearlo in Alimenti, Nuovo alimento.</div>`;
  } else {
    const ok = f => f && (!pick.noRecipes || f.kind!=='recipe');
    const favs = S.favs.map(id=>DB.byId.get(id)).filter(ok);
    const rec = S.recents.map(id=>DB.byId.get(id)).filter(f=>ok(f) && !S.favs.includes(f.id)).slice(0,8);
    pick.list = [...favs, ...rec]; let i = 0;
    if(favs.length) h += `<div class="grp">Preferiti</div>` + favs.map(f=>resHTML(f,i++)).join('');
    if(rec.length) h += `<div class="grp">Usati di recente</div>` + rec.map(f=>resHTML(f,i++)).join('');
    if(!h) h = `<div class="empty">Scrivi almeno due lettere per cercare tra ${pool.length} alimenti. Puoi usare più parole, ad esempio "latte scremato".</div>`;
  }
  box.innerHTML = h;
  if(onlyKb){ const el = box.querySelector('.kb'); el && el.scrollIntoView({block:'nearest'}); }
}
function guessCook(f){
  const k = f.key, has = (...w)=>w.some(x=>k.includes(x));
  if(has('riso')) return 'riso';
  if(has('pasta all uovo','pasta fresca','tortellini','ravioli','gnocchi','tagliatelle')) return 'fresca';
  if(has('pasta','spaghetti','maccheroni','penne')) return 'pasta';
  if(has('couscous','cous cous','cuscus')) return 'couscous';
  if(has('orzo','farro','avena','quinoa','bulgur','miglio','grano saraceno')) return 'cereali';
  if(has('ceci','fagioli','lenticchie','piselli','fave','lupini','soia')) return 'legumi';
  if(has('patat')) return 'patate';
  if(has('pollo','tacchino','manzo','vitello','bovino','maiale','agnello','coniglio','cavallo','suino')) return 'carne';
  if(has('merluzzo','nasello','orata','spigola','branzino','salmone','sogliola','trota','platessa','palombo','pesce','tonno','sgombro','acciughe','alici','sardine','calamari','seppie','polpo','gamberi')) return 'pesce';
  if(has('spinaci','bietole','cavol','broccol','zucchin','fagiolini','carote','verza','cicoria','carciof')) return 'verdure';
  return 'pasta';
}
function cookOf(k){ return S.cook.find(c=>c.k===k) || S.cook[0]; }
function pickerRawG(){
  if(pick.mode==='cotto'){ const c = cookOf(pick.cf); return num($('#pk-cw').value)/(c.f||1); }
  if(pick.mode==='mis'){ const m = S.measures[pick.mi||0]; return num($('#pk-mn').value)*(m?m.g:0); }
  return num($('#pk-g').value);
}
function pickerQty(id){

      <div><label class="fld" for="pk-mn">Quante</label><div class="row"><button class="iconbtn" data-mn="-1" aria-label="Meno">${svgI('i-minus')}</button><input class="in num" id="pk-mn" inputmode="decimal" value="${fmtIn(pick.mn||1,1)}" style="max-width:90px;font-size:20px;font-weight:600;text-align:center"><button class="iconbtn" data-mn="1" aria-label="Più">${svgI('i-plus')}</button><span class="muted" id="pk-eq"></span></div></div>`;
  } else {
    inp = `<div><label class="fld" for="pk-g">Quantità in grammi</label>
      <div class="row"><input class="in num" id="pk-g" inputmode="decimal" value="${fmtIn(g0, g0%1?1:0)}" style="max-width:140px;font-size:20px;font-weight:600">
      <div class="chips">${[30,50,80,100,150,200,250,300].map(g=>`<button data-chip="${g}">${g}</button>`).join('')}</div></div></div>`;
  }
  $('#sheet-b').innerHTML = `<div class="qty">

function pickerCommit(more){

/* ---- backup ---- */
const stamp = ()=>{ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function toB64(bytes){ let s = ''; for(let i=0;i<bytes.length;i+=0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(s); }
const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
function saveBytes(bytes, name, mime){
  if(window.AndroidBridge && AndroidBridge.saveFile){ AndroidBridge.saveFile(name, mime, toB64(bytes)); return; }
  if(IS_IOS && navigator.canShare){
    let f = null; try{ f = new File([bytes], name, {type:mime}); }catch(e){}
    if(f && navigator.canShare({files:[f]})){ navigator.share({files:[f], title:name}).catch(()=>{}); return; }
  }
  const blob = new Blob([bytes], {type:mime}), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
function backupText(){ return JSON.stringify(Object.assign({esportato:new Date().toISOString(), versioneApp:APP.versione}, S)); }
function applyBackup(txt){
  let o; try{ o = JSON.parse(txt); }catch(e){ toast('Il testo non è un backup valido'); return; }
  if(!o || o.app!=='bilancio-menu'){ toast('Il file non è un backup di Bilancio Menù'); return; }
  confirmSheet('Importare il backup?', 'Profilo, menù, ricette e alimenti personali attuali verranno sostituiti da quelli del backup.', 'Importa', ()=>{
    S = migrate(o); buildDB(); save(); render(); toast('Backup importato');
  });
}
window.onNativeSaved = ok => toast(ok ? 'File salvato' : 'Salvataggio annullato');

document.addEventListener('click', e=>{
  const t = e.target.closest('button,[data-food],[data-day-go],[data-sort]'); if(!t) return;
  const d = t.dataset;
  if(d.go) return go(d.go);
  if(d.sub && SUBTABS[S.ui.page]){ S.ui[SUBTABS[S.ui.page].key] = d.sub; save(); render(); return window.scrollTo(0,0); }
  if(d.day!=null){ S.ui.day = +d.day; save(); return renderMenu(); }
  if(d.dayGo!=null){ S.ui.day = +d.dayGo; return go('menu','days'); }
  if(d.qm){ pick.g = pickerRawG(); pick.mode = d.qm; return pickerQty(pick.id); }
  if(d.mn){ const i = $('#pk-mn'); const n = Math.max(0.5, (num(i.value)||0) + (+d.mn)); i.value = fmtIn(n,1); i.oninput(); return; }
  if(d.view){ S.ui.view = d.view; save(); return refreshCur(); }
  if(d.avg){ S.ui.avg = d.avg; save(); return renderWeek(); }
  if(d.fcols){ S.ui.fcols = d.fcols; if(fsort.k!=='name' && !FCOLS[d.fcols].includes(fsort.k)) fsort = {k:'name',dir:1}; save(); return renderFoods(); }
  if(d.fkind){ S.ui.fkind = d.fkind; save(); return renderFoods(); }
  if(d.sort){ fsort = fsort.k===d.sort ? {k:d.sort, dir:-fsort.dir} : {k:d.sort, dir:d.sort==='name'?1:-1}; return renderFoods(); }
  if(d.food) return openFood(d.food);
  if(d.sex){ S.profile.sesso = d.sex; save(); $$('[data-sex]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.sex===d.sex)); return renderProfileOut(); }
  if(d.add){
    const meal = d.add, M = curMeals(), dk = S.ui.page==='today' ? selDate() : null;
    const where = dk ? (dk===dateKey() ? 'oggi' : dateLabel(dk)) : DAY_NAMES[S.ui.day].toLowerCase();
    return openPicker({title:`Aggiungi a ${MEALS.find(x=>x.k===meal).l.toLowerCase()}, ${where}`, onPick:(item)=>{
      M[meal].push(item); if(dk) diaryEntry(dk,true).t = Date.now(); refreshCur(); }});
  }
  if(d.del){
    const [m,ix] = d.del.split(':'), M = curMeals(), arr = M[m], it = arr[+ix];
    arr.splice(+ix,1); touchCur(); save(); refreshCur();

  if(d.pk) return pickChoose(d.pk);
  if(d.chip){ const i = $('#pk-g'); i.value = d.chip; i.oninput(); return; }
  if(d.editrecipe){ draft = clone(S.recipes.find(r=>r.id===d.editrecipe)); return renderRecipes(); }
  if(d.delrecipe){
    const r = S.recipes.find(x=>x.id===d.delrecipe), u = usageOf(r.id);
    return confirmSheet('Eliminare la ricetta?', `"${esc(r.name)}" verrà eliminata${u?` e rimossa dai menù in cui compare (${u})`:''}.`, 'Elimina', ()=>{
      S.recipes = S.recipes.filter(x=>x.id!==r.id);
      removeFoodEverywhere(r.id);
      buildDB(); save(); render(); toast('Ricetta eliminata');
    }, true);
  }
  if(d.rdel!=null){ draft.items.splice(+d.rdel,1); return renderRecipes(); }
  switch(d.act){
    case 'close': return closeSheet();
    case 'share': return openShare();
    case 'daydetail': return dayDetail();
    case 'copyday': return copyDay();
    case 'clearday': {
      const day = S.ui.day, nm = DAY_NAMES[day].toLowerCase();
      if(!dayFilled(day)) return toast(`Il menù di ${nm} è già vuoto`);
      return confirmSheet(`Svuotare ${nm}?`, 'Tutti gli alimenti dei quattro pasti verranno rimossi.', 'Svuota', ()=>{
        const old = clone(S.menus[day]); S.menus[day] = {colazione:[],pranzo:[],spuntini:[],cena:[]}; save(); renderMenu();
        toast(`Menù di ${nm} svuotato`, ()=>{ S.menus[day] = old; save(); renderMenu(); });
      }, true);
    }
    case 'pkback': { const g = pickerRawG(); pick.g = g>0 ? g : null; pick.mode = null; return pickerSearch(); }
    case 'pkadd': return pickerCommit(false);
    case 'pkmore': return pickerCommit(true);
    case 'newrecipe': draft = {id:uid('r'), name:'', items:[]}; renderRecipes(); setTimeout(()=>$('#r-name')&&$('#r-name').focus(),30); return;
    case 'raddi': return openPicker({title:'Aggiungi ingrediente', noRecipes:true, onPick:(item)=>{ draft.items.push({id:item.id, g:item.g}); renderRecipes(); }});

      if(ix>=0) S.recipes[ix] = draft; else S.recipes.push(draft);
      const nm = draft.name; draft = null; buildDB(); save(); renderRecipes();
      return toast(ix>=0 ? `Ricetta aggiornata: ${nm}` : `Ricetta salvata: ${nm}`);
    }
    case 'refreset':
      return confirmSheet('Ripristinare i valori del file?', 'I valori ideali e massimi torneranno quelli del foglio Comp. Bromatologica media.', 'Ripristina', ()=>{ S.ref = clone(FILE_DEFAULTS); save(); renderProfile(); toast('Valori ripristinati'); });
    case 'export': saveBytes(new TextEncoder().encode(backupText()), `BilancioMenu_backup_${stamp()}.json`, 'application/json'); if(!window.AndroidBridge) toast('Backup esportato'); return;

      $('#bk-go').onclick = ()=>{ const v = $('#bk-i').value; closeSheet(); applyBackup(v); };

const FW = window.__FW__;
function winAnsi(str){
  let o = '';
  for(const ch of String(str)){
    const c = ch.codePointAt(0);
    if(c>=32 && c<127) o += ch;
    else if(c>=160 && c<=255) o += String.fromCharCode(c);
    else if(FW.map[c]) o += String.fromCharCode(FW.map[c]);
    else if(c===0x202F || c===0x2009) o += ' ';
    else o += '?';
  }
  return o;
}
function textW(str, size, bold){
  const s = winAnsi(str), w = bold ? FW.B : FW.R; let t = 0;
  for(let i=0;i<s.length;i++){ const c = s.charCodeAt(i); t += c>=32 ? (w[c-32]||556) : 0; }
  return t*size/1000;
}
const pesc = s => s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
const pn = v => String(Math.round(v*100)/100);
class Pdf{
  constructor(){ this.W = 595.28; this.H = 841.89; this.pages = []; }
  add(){ this.c = []; this.pages.push(this.c); }
  rgb(h){ const n = parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255].map(v=>pn(v/255)).join(' '); }
  rect(x,y,w,h,fill){ this.c.push(`${this.rgb(fill)} rg ${pn(x)} ${pn(this.H-y-h)} ${pn(w)} ${pn(h)} re f`); }
  rrect(x,y,w,h,r,fill){
    const k = 0.5523*r, X = x, Y = this.H-y-h, H = this.H;
    this.c.push(`${this.rgb(fill)} rg ${pn(X+r)} ${pn(Y)} m ${pn(X+w-r)} ${pn(Y)} l ${pn(X+w-r+k)} ${pn(Y)} ${pn(X+w)} ${pn(Y+r-k)} ${pn(X+w)} ${pn(Y+r)} c ${pn(X+w)} ${pn(Y+h-r)} l ${pn(X+w)} ${pn(Y+h-r+k)} ${pn(X+w-r+k)} ${pn(Y+h)} ${pn(X+w-r)} ${pn(Y+h)} c ${pn(X+r)} ${pn(Y+h)} l ${pn(X+r-k)} ${pn(Y+h)} ${pn(X)} ${pn(Y+h-r+k)} ${pn(X)} ${pn(Y+h-r)} c ${pn(X)} ${pn(Y+r)} l ${pn(X)} ${pn(Y+r-k)} ${pn(X+r-k)} ${pn(Y)} ${pn(X+r)} ${pn(Y)} c f`);
  }
  line(x1,y1,x2,y2,col,w=0.5,dash){ this.c.push(`q ${this.rgb(col)} RG ${pn(w)} w ${dash?`[${dash}] 0 d `:''}${pn(x1)} ${pn(this.H-y1)} m ${pn(x2)} ${pn(this.H-y2)} l S Q`); }
  arc(cx,cy,r,a0,a1,col,w){
    const pts = []; for(let a=a0; a<a1; a+=4) pts.push(a); pts.push(a1);
    const P = a=>[cx + r*Math.sin(a*Math.PI/180), this.H - (cy - r*Math.cos(a*Math.PI/180))];
    let s = `q ${this.rgb(col)} RG ${pn(w)} w 0 J `;
    pts.forEach((a,i)=>{ const [x,y] = P(a); s += `${pn(x)} ${pn(y)} ${i?'l':'m'} `; });
    this.c.push(s+'S Q');
  }
  circle(cx,cy,r,fill){ const k = 0.5523*r, X = cx, Y = this.H-cy;
    this.c.push(`${this.rgb(fill)} rg ${pn(X+r)} ${pn(Y)} m ${pn(X+r)} ${pn(Y+k)} ${pn(X+k)} ${pn(Y+r)} ${pn(X)} ${pn(Y+r)} c ${pn(X-k)} ${pn(Y+r)} ${pn(X-r)} ${pn(Y+k)} ${pn(X-r)} ${pn(Y)} c ${pn(X-r)} ${pn(Y-k)} ${pn(X-k)} ${pn(Y-r)} ${pn(X)} ${pn(Y-r)} c ${pn(X+k)} ${pn(Y-r)} ${pn(X+r)} ${pn(Y-k)} ${pn(X+r)} ${pn(Y)} c f`); }
  text(x,y,s,o={}){
    const size = o.size||9, bold = !!o.bold; s = o.raw ? String(s) : tr(String(s));
    let X = x; if(o.align==='right') X = x - textW(s,size,bold); else if(o.align==='center') X = x - textW(s,size,bold)/2;
    this.c.push(`BT /${bold?'F2':'F1'} ${size} Tf ${this.rgb(o.color||'#1b2433')} rg ${pn(X)} ${pn(this.H-y)} Td (${pesc(winAnsi(s))}) Tj ET`);
  }
  fit(s, maxW, size, bold){ s = tr(String(s)); if(textW(s,size,bold)<=maxW) return s; while(s.length>1 && textW(s+'…',size,bold)>maxW) s = s.slice(0,-1); return s.trimEnd()+'…'; }
  build(meta){
    const objs = [null, null], add = s=>{ objs.push(s); return objs.length; };
    const f1 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    const f2 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const kids = [];
    for(const p of this.pages){
      const s = p.join('\n');
      const cs = add(`<< /Length ${s.length} >>\nstream\n${s}\nendstream`);
      kids.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pn(this.W)} ${pn(this.H)}] /Resources << /Font << /F1 ${f1} 0 R /F2 ${f2} 0 R >> >> /Contents ${cs} 0 R >>`));
    }
    objs[0] = '<< /Type /Catalog /Pages 2 0 R >>';
    objs[1] = `<< /Type /Pages /Kids [${kids.map(k=>k+' 0 R').join(' ')}] /Count ${kids.length} >>`;
    const d = new Date(), z = n=>String(n).padStart(2,'0');
    const info = add(`<< /Title (${pesc(winAnsi(meta.title))}) /Author (${pesc(winAnsi(APP.autore))}) /Creator (${pesc(winAnsi(APP.nome+' '+APP.versione))}) /Producer (${pesc(winAnsi(APP.nome+' '+APP.versione))}) /CreationDate (D:${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}) >>`);
    let out = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'; const offs = [];
    objs.forEach((o,i)=>{ offs.push(out.length); out += `${i+1} 0 obj\n${o}\nendobj\n`; });
    const xref = out.length;
    out += `xref\n0 ${objs.length+1}\n0000000000 65535 f \n` + offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('');
    out += `trailer\n<< /Size ${objs.length+1} /Root 1 0 R /Info ${info} 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
    const b = new Uint8Array(out.length); for(let i=0;i<out.length;i++) b[i] = out.charCodeAt(i) & 255;
    return b;
  }
}

  function barsChart(title, vals, labels, max, ideal){

    const ch = 110, top = y, mx = Math.max(...vals.filter(v=>v!=null), isFinite(max)?max:0, 100)*1.12;
    const sy = v => top + ch*(1 - v/mx), L = M+34, RR = M+CW-50, cw = (RR-L)/vals.length;
    const step = mx>3000?1000:mx>1200?500:mx>500?200:50;
    for(let v=0; v<=mx; v+=step){ doc.line(L,sy(v),RR,sy(v),PC.hair,0.6); doc.text(L-5,sy(v)+3,fmt(v),{size:7,color:PC.fa,align:'right'}); }

let shareKind = 'day';
function waNumber(){
  let d = (S.share.wa||'').replace(/\D/g,'');
  if(d.startsWith('00')) d = d.slice(2);
  if(/^3\d{8,9}$/.test(d)) d = '39'+d;
  return d;
}
function openShare(){
  const vk = viewKey();
  const dOK = entryUsed(S.diary[selDate()]), mOK = dayFilled(S.ui.day);
  const filled = Array.from({length:DAYS},(_,i)=>i).filter(dayFilled);
  const R = trendData(S.ui.trendDays), shopN = shopList(S.shopDays).length;
  const av = {diary:dOK, trend:R.used>0, day:mOK, week:filled.length>0, full:filled.length>0, shop:shopN>0};
  const pref = {today:'diary', trend:'trend', 'menu/days':'day', 'menu/summary':'week', 'menu/shop':'shop'}[vk];
  if(pref && av[pref]) shareKind = pref;
  if(!av[shareKind]) shareKind = Object.keys(av).find(k=>av[k]) || null;
  if(!shareKind){ toast('Non ci sono ancora dati da mettere nel PDF'); return; }
  const opt = (k,l,sub)=>`<button class="opt" data-sk="${k}" aria-pressed="${shareKind===k}" ${av[k]?'':'disabled'}><span class="radio"></span><span><b>${l}</b><small>${sub}</small></span></button>`;
